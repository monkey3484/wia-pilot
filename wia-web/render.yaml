# Render 블루프린트 (Starter 인스턴스 + 1GB 디스크). 무료 구성은 README의 "무료 구성" 참고.
services:
  - type: web
    name: wia-pilot
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TEACHER_ID
        sync: false
      - key: TEACHER_PW
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: ADMIN_PW
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: ADMIN_EMAIL
        sync: false
    disk:
      name: wia-data
      mountPath: /var/data
      sizeGB: 1
