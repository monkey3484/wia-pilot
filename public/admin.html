<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>위아 관리자</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root { color-scheme: light; --bg: #f3f6fc; --surface: #fff; --surface-2: #f3f7ff; --ink: #1d2447; --muted: #5d6b8f; --line: #e1e8f5; --accent: #3b82f6; --accent-d: #1f5fd1; --good: #1c8c3c; --good-bg: #dcf7d6; --warn: #a85a00; --warn-bg: #ffefd2; --weak: #c23535; --weak-bg: #ffe3e1; --vio: #6d4fd6; --vio-bg: #ece6ff; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.55 "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; word-break: keep-all; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent-d); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.top { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 16px; padding: 10px 20px; flex-wrap: wrap; }
.top b.logo { font-size: 16px; font-weight: 800; color: var(--accent); white-space: nowrap; }
.tabs { display: flex; gap: 2px; flex-wrap: wrap; flex: 1; }
.tab { border: 0; background: none; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 600; position: relative; }
.tab[aria-selected="true"] { background: var(--surface-2); color: var(--ink); }
.tab .dot { display: inline-block; min-width: 18px; padding: 0 5px; border-radius: 9px; background: var(--weak); color: #fff; font-size: 11px; line-height: 18px; text-align: center; margin-left: 4px; }
.top .right { display: flex; gap: 10px; align-items: center; color: var(--muted); font-size: 12px; }
main { max-width: 1280px; margin: 0 auto; padding: 20px; }
h2 { font-size: 18px; margin: 0 0 12px; }
h3 { font-size: 15px; margin: 0 0 10px; }
.meta { color: var(--muted); font-size: 12px; }
.grid { display: grid; gap: 12px; }
.g4 { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.g2 { grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.tile .k { color: var(--muted); font-size: 12px; font-weight: 600; }
.tile .v { font-size: 26px; font-weight: 800; line-height: 1.2; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 4px; }
.tile .s { color: var(--muted); font-size: 12px; margin-top: 2px; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); margin-top: 8px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.bar.warn i { background: #e69a2e; } .bar.bad i { background: var(--weak); }
.spark { width: 100%; height: 64px; display: block; margin-top: 6px; }
.sec { margin-top: 22px; }
.badge { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.b-active { background: var(--good-bg); color: var(--good); }
.b-pending_approval { background: var(--warn-bg); color: var(--warn); }
.b-pending_email { background: var(--surface-2); color: var(--muted); }
.b-suspended { background: var(--weak-bg); color: var(--weak); }
.b-ai { background: var(--vio-bg); color: var(--vio); }
.b-test { background: var(--surface-2); color: var(--muted); }
.b-error { background: var(--weak-bg); color: var(--weak); }
.b-on { background: var(--good-bg); color: var(--good); }
.b-off { background: var(--surface-2); color: var(--muted); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--surface-2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tw { overflow-x: auto; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-d); }
.btn.danger { color: var(--weak); }
.btn.sm { padding: 3px 8px; font-size: 12px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.sp { flex: 1; }
.in { border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff; width: 100%; }
textarea.in { font: 13px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; resize: vertical; }
label.f { display: block; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; }
.chk { display: flex; gap: 8px; align-items: center; font-weight: 600; cursor: pointer; }
.chk input { width: 18px; height: 18px; accent-color: var(--accent); }
.empty { text-align: center; color: var(--muted); padding: 28px; }
.pill { display: inline-block; background: var(--surface-2); border-radius: 6px; padding: 1px 6px; margin: 2px 2px 0 0; font-size: 12px; }
.stu { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.stu span { background: var(--surface-2); border-radius: 6px; padding: 2px 8px; font-size: 12px; }
.stu span.fin { background: var(--good-bg); color: var(--good); }
pre { white-space: pre-wrap; word-break: break-word; background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 12px; max-height: 360px; overflow: auto; margin: 0; }
.drawer-bg { position: fixed; inset: 0; background: rgba(29, 36, 71, .35); z-index: 20; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100vw); background: var(--bg); z-index: 21; overflow-y: auto; box-shadow: -10px 0 40px rgba(0,0,0,.15); }
.drawer .dh { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 14px 20px; display: flex; align-items: center; gap: 10px; z-index: 1; }
.drawer .db { padding: 16px 20px 40px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 110px 1fr; gap: 6px 12px; }
.kv dt { color: var(--muted); font-size: 12px; font-weight: 700; padding-top: 1px; }
.kv dd { margin: 0; }
.slide { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--surface); }
.slide b { display: block; }
.slide .src { color: var(--muted); font-size: 12px; }
mark.todo { background: #ffe082; color: #3b3000; border-radius: 3px; padding: 0 2px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px; z-index: 40; font-weight: 600; }
.login { max-width: 380px; margin: 12vh auto; }
.login .card { padding: 28px; display: flex; flex-direction: column; gap: 12px; }
.err { background: var(--weak-bg); color: var(--weak); border-radius: 8px; padding: 8px 12px; margin: 0; }
.warnbox { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 14px; margin: 0 0 12px; }
.ver { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; background: var(--surface); }
.ver.on { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(59,130,246,.15); }
.lgd { display: flex; gap: 12px; font-size: 12px; color: var(--muted); }
.lgd i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <form class="card" id="f-login">
    <b style="color:var(--accent);font-size:18px">위아 관리자</b>
    <p class="meta" style="margin:0">서버 환경 변수 ADMIN_ID / ADMIN_PW로 로그인해요.</p>
    <div><label class="f" for="a-id">아이디</label><input class="in" id="a-id" autocomplete="username" value="admin"></div>
    <div><label class="f" for="a-pw">비밀번호</label><input class="in" id="a-pw" type="password" autocomplete="current-password"></div>
    <p class="err" id="a-err" hidden></p>
    <button class="btn primary" type="submit">로그인</button>
  </form>
</div>
<div id="app" hidden>
  <header class="top">
    <b class="logo">위아 관리자</b>
    <nav class="tabs" role="tablist" id="tabs"></nav>
    <div class="right"><span id="upd"></span><button class="btn sm" id="logout">로그아웃</button></div>
  </header>
  <main id="main"></main>
</div>
<div id="drawer"></div>
<div class="toast" id="toast" hidden></div>
<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var todo = function (s) { return esc(s).replace(/\(확인 필요[^)]*\)/g, function (m) { return '<mark class="todo">' + m + '</mark>'; }); };
  var fmt = function (n) { return (n == null || isNaN(n)) ? '-' : Number(n).toLocaleString('ko-KR'); };
  var usd = function (n) { return '$' + (n || 0).toFixed(n >= 100 ? 0 : 2); };
  var krw = function (n) { return '약 ' + Math.round((n || 0) * 1400).toLocaleString('ko-KR') + '원'; };
  var bytes = function (n) { if (n == null) return '-'; return n > 1073741824 ? (n / 1073741824).toFixed(2) + 'GB' : n > 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.round(n / 1024) + 'KB'; };
  var when = function (t) { if (!t) return '-'; var d = new Date(t), now = Date.now(), s = (now - t) / 1000; if (s < 60) return '방금'; if (s < 3600) return Math.floor(s / 60) + '분 전'; if (s < 86400) return Math.floor(s / 3600) + '시간 전'; return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  var dt = function (t) { if (!t) return '-'; var d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0') + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
  var dur = function (ms) { var s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? h + '시간 ' + m + '분' : m + '분'; };
  var ST = { active: '사용 중', pending_approval: '승인 대기', pending_email: '메일 인증 전', suspended: '멈춤' };
  var LIM = { maxStudents: ['수업당 최대 학생', '명'], aiPerDay: ['AI 만들기 / 하루', '번'], aiPerMonth: ['AI 만들기 / 한 달', '번'], maxFiles: ['한 번에 올릴 파일', '개'], maxUploadMB: ['한 번에 올릴 용량', 'MB'], maxPages: ['교육 자료 최대 장수', '장'], maxLessons: ['저장할 콘텐츠 수', '개'] };

  function toast(t) { var e = $('#toast'); e.textContent = t; e.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function () { e.hidden = true; }, 2600); }
  function api(method, url, body) {
    return fetch(url, { method: method, credentials: 'same-origin', headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (r.status === 401 && url.indexOf('/api/admin/login') < 0) { showLogin(); throw new Error('login'); } if (!r.ok && d.ok !== false) d.ok = false; return d; }); });
  }
  var get = function (u) { return api('GET', u); }, post = function (u, b) { return api('POST', u, b || {}); };

  /* ---------- 로그인 ---------- */
  function showLogin() { $('#app').hidden = true; $('#login').hidden = false; $('#a-pw').focus(); }
  $('#f-login').addEventListener('submit', function (e) {
    e.preventDefault();
    post('/api/admin/login', { id: $('#a-id').value.trim(), pw: $('#a-pw').value }).then(function (d) {
      if (!d.ok) { $('#a-err').textContent = d.error || '로그인하지 못했어요.'; $('#a-err').hidden = false; return; }
      $('#login').hidden = true; start();
    }).catch(function () {});
  });
  $('#logout').addEventListener('click', function () { post('/api/admin/logout').then(function () { location.reload(); }); });

  /* ---------- 탭 ---------- */
  var TABS = [['overview', '개요'], ['teachers', '선생님'], ['live', '수업 중'], ['ai', 'AI 기록'], ['prompt', '프롬프트·모델'], ['limits', '제한 설정'], ['mail', '메일함']];
  var tab = (location.hash || '#overview').slice(1); if (!TABS.some(function (t) { return t[0] === tab; })) tab = 'overview';
  var S = { ov: null, teachers: null, live: null, logs: null, set: null, mails: null, tFilter: 'all', tq: '' };
  function drawTabs() {
    var pend = S.ov ? S.ov.teachers.pending : 0;
    $('#tabs').innerHTML = TABS.map(function (t) { return '<button class="tab" role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + t[1] + (t[0] === 'teachers' && pend ? '<span class="dot">' + pend + '</span>' : '') + (t[0] === 'live' && S.ov && S.ov.liveClasses ? '<span class="dot" style="background:var(--good)">' + S.ov.liveClasses + '</span>' : '') + '</button>'; }).join('');
  }
  $('#tabs').addEventListener('click', function (e) { var b = e.target.closest('[data-tab]'); if (!b) return; tab = b.dataset.tab; history.replaceState(null, '', '#' + tab); drawTabs(); load(true); });

  function load(first) {
    var jobs = [get('/api/admin/overview').then(function (d) { S.ov = d; })];
    if (tab === 'teachers') jobs.push(get('/api/admin/teachers').then(function (d) { S.teachers = d.teachers; }));
    if (tab === 'live') jobs.push(get('/api/admin/live').then(function (d) { S.live = d.live; }));
    if (tab === 'ai') jobs.push(get('/api/admin/ai/logs?limit=300').then(function (d) { S.logs = d.logs; }));
    if (!S.set || ((tab === 'prompt' || tab === 'limits') && first)) jobs.push(get('/api/admin/settings').then(function (d) { S.set = d; }));
    if (tab === 'mail') jobs.push(get('/api/admin/mails').then(function (d) { S.mails = d; }));
    return Promise.all(jobs).then(function () {
      drawTabs();
      $('#upd').textContent = '업데이트 ' + new Date().toLocaleTimeString('ko-KR');
      /* 입력 중인 화면(프롬프트·제한)은 처음에만 그려요 */
      if (!first && (tab === 'prompt' || tab === 'limits')) return;
      if (!first && document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && $('#main').contains(document.activeElement)) return;
      render();
    }).catch(function (e) { if (e.message !== 'login') $('#upd').textContent = '서버에 연결하지 못했어요'; });
  }
  function start() { $('#app').hidden = false; drawTabs(); load(true); clearInterval(start.t); start.t = setInterval(function () { if (!document.hidden) load(false); }, 5000); }

  function render() {
    var m = $('#main');
    if (tab === 'overview') m.innerHTML = vOverview();
    else if (tab === 'teachers') m.innerHTML = vTeachers();
    else if (tab === 'live') m.innerHTML = vLive();
    else if (tab === 'ai') m.innerHTML = vAI();
    else if (tab === 'prompt') m.innerHTML = vPrompt();
    else if (tab === 'limits') m.innerHTML = vLimits();
    else if (tab === 'mail') m.innerHTML = vMail();
  }

  /* ---------- 작은 그래프 ---------- */
  function spark(series, max) {
    var W = 600, H = 64, n = 0; series.forEach(function (s) { n = Math.max(n, s.v.length); });
    if (n < 2) return '<p class="meta" style="margin:10px 0">1분마다 기록해요. 잠시 뒤에 그래프가 보여요.</p>';
    var mx = max || 1; series.forEach(function (s) { s.v.forEach(function (x) { if (x > mx) mx = x; }); });
    return '<svg class="spark" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none" role="img">' + series.map(function (s) {
      var pts = s.v.map(function (x, i) { return (i / (n - 1) * W).toFixed(1) + ',' + (H - 3 - (x / mx) * (H - 8)).toFixed(1); }).join(' ');
      return '<polyline points="' + pts + '" fill="none" stroke="' + s.c + '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
    }).join('') + '</svg><div class="row meta" style="justify-content:space-between"><span>' + (n > 60 ? Math.round(n / 60) + '시간 전' : n + '분 전') + '</span><span>최고 ' + fmt(Math.round(mx * 10) / 10) + '</span><span>지금</span></div>';
  }
  function tile(k, v, s, pct) {
    var b = pct == null ? '' : '<div class="bar' + (pct > 90 ? ' bad' : pct > 70 ? ' warn' : '') + '"><i style="width:' + Math.min(100, pct).toFixed(1) + '%"></i></div>';
    return '<div class="card tile"><div class="k">' + k + '</div><div class="v">' + v + '</div>' + (s ? '<div class="s">' + s + '</div>' : '') + b + '</div>';
  }

  /* ---------- 개요 ---------- */
  function vOverview() {
    var o = S.ov; if (!o) return '<p class="empty">불러오는 중…</p>';
    var h = o.hist || [], memCap = 512;
    var warn = [];
    if (!o.ai.hasKey) warn.push('AI 키(ANTHROPIC_API_KEY)가 없어 <b>시범 모드</b>예요. 선생님이 자료를 올리면 예시 틀로 만들어져요.');
    if (o.mail.mode === 'test') warn.push('메일 키(RESEND_API_KEY)가 없어 인증 메일이 실제로 가지 않아요. 가입 신청은 <b>선생님</b> 탭에서 직접 승인해 주세요.');
    else if (/resend\.dev/.test(o.mail.from)) warn.push('보내는 주소가 onboarding@resend.dev라서 Resend 가입 이메일로만 메일이 가요. 도메인을 인증한 뒤 MAIL_FROM을 바꿔 주세요.');
    if (o.storage === 'file') warn.push('데이터를 서버 파일에 저장 중이에요. 무료 Render에서는 재시작 때 지워질 수 있으니 DATABASE_URL(Neon)을 연결해 주세요.');
    var aiPct = o.ai.budget ? o.ai.monthCost / o.ai.budget * 100 : 0;
    return (warn.length ? warn.map(function (w) { return '<p class="warnbox">' + w + '</p>'; }).join('') : '') +
      '<div class="grid g4">' +
      tile('접속한 선생님', fmt(o.teachers.online) + '<small>/ ' + fmt(o.teachers.active) + '명</small>', '사용 중 계정 ' + o.teachers.active + ' · 승인 대기 ' + o.teachers.pending) +
      tile('접속한 학생', fmt(o.students) + '<small>명</small>', '진행 중 수업 ' + o.liveClasses + '개 · 연결 ' + fmt(o.sockets) + '개') +
      tile('AI 비용 (이번 달)', usd(o.ai.monthCost) + '<small>' + krw(o.ai.monthCost) + '</small>', '예산 ' + usd(o.ai.budget) + ' · 오늘 ' + o.ai.dayCount + '번 · 이번 달 ' + o.ai.monthCount + '번', aiPct) +
      tile('AI 토큰 (이번 달)', fmt(Math.round((o.ai.tokIn + o.ai.tokOut) / 1000)) + '<small>K</small>', '입력 ' + fmt(o.ai.tokIn) + ' · 출력 ' + fmt(o.ai.tokOut) + (o.ai.running ? ' · 지금 ' + o.ai.running + '개 생성 중' : '')) +
      tile('서버 메모리', fmt(o.mem.rssMB) + '<small>MB</small>', '무료 Render 기준 512MB · 힙 ' + o.mem.heapMB + 'MB', o.mem.rssMB / memCap * 100) +
      tile('서버 CPU', fmt(o.cpu) + '<small>%</small>', '1분 평균 · 켜진 지 ' + dur(o.now - o.startedAt), o.cpu) +
      tile('데이터베이스', bytes(o.dbBytes), (o.storage === 'postgres' ? 'PostgreSQL · Neon 무료 1GB' : '서버 파일') + ' · ' + fmt(o.rows) + '행', o.storage === 'postgres' && o.dbBytes ? o.dbBytes / 1073741824 * 100 : null) +

  /* ---------- AI 기록 ---------- */
  function vAI() {
    var L = S.logs; if (!L) return '<p class="empty">불러오는 중…</p>';
    var o = S.ov, ok = L.filter(function (x) { return x.status !== 'error' && x.mode === 'ai'; });
    var avg = ok.length ? ok.reduce(function (a, x) { return a + x.cost; }, 0) / ok.length : 0;
    return '<div class="grid g4">' + tile('이번 달 AI 생성', fmt(o.ai.monthCount) + '<small>번</small>', '오늘 ' + o.ai.dayCount + '번') + tile('이번 달 비용', usd(o.ai.monthCost), krw(o.ai.monthCost) + ' · 예산 ' + usd(o.ai.budget), o.ai.budget ? o.ai.monthCost / o.ai.budget * 100 : 0) + tile('한 번 평균 비용', usd(avg), krw(avg)) + tile('실패', fmt(L.filter(function (x) { return x.status === 'error'; }).length) + '<small>번</small>', '최근 ' + L.length + '개 기록 중') + '</div>' +
      '<div class="card sec" style="padding:0">' + logTable(L) + '</div><p class="meta">줄을 누르면 올린 자료, 뽑아낸 글, AI가 만든 결과와 근거를 볼 수 있어요. 비용은 Anthropic 가격표로 계산한 추정치예요 (환율 1,400원).</p>';
  }

  /* ---------- 프롬프트·모델 ---------- */
  function vPrompt() {
    var D = S.set; if (!D) return '<p class="empty">불러오는 중…</p>';
    var c = D.cfg, act = c.prompts.filter(function (p) { return p.v === c.promptActive; })[0] || c.prompts[c.prompts.length - 1];
    var ed = S.pEdit || act;
    return (!D.env.ai ? '<p class="warnbox">ANTHROPIC_API_KEY가 아직 없어서 프롬프트는 저장만 되고 실제로 쓰이지 않아요. 키를 넣으면 바로 이 프롬프트로 만들어요.</p>' : '') +
      '<div class="grid g2"><div class="card"><h3>모델 설정</h3><div class="fgrid">' +
      '<div><label class="f" for="m-model">모델</label><select class="in" id="m-model">' + D.models.map(function (m) { var p = D.prices[m]; return '<option value="' + m + '"' + (m === c.ai.model ? ' selected' : '') + '>' + m + ' ($' + p[0] + ' / $' + p[1] + ')</option>'; }).join('') + '</select><div class="meta">괄호: 1백만 토큰당 입력/출력 달러</div></div>' +
      '<div><label class="f" for="m-max">최대 출력 토큰</label><input class="in" id="m-max" inputmode="numeric" value="' + c.ai.maxTokens + '"><div class="meta">20장이면 1만 6천이면 충분해요</div></div>' +
      '<div><label class="f" for="m-temp">temperature (0~1)</label><input class="in" id="m-temp" inputmode="decimal" placeholder="비우면 모델 기본값" value="' + (c.ai.temperature == null ? '' : c.ai.temperature) + '"><div class="meta">낮을수록 자료에 충실해요</div></div>' +
      '</div><div class="row" style="margin-top:12px"><label class="chk"><input type="checkbox" id="m-on"' + (c.global.aiEnabled ? ' checked' : '') + '> AI 만들기 켜기</label><span class="sp"></span><button class="btn primary" data-act="saveModel">모델 저장</button></div></div>' +
      '<div class="card"><h3>프롬프트 버전</h3><div class="grid" style="gap:6px;max-height:260px;overflow:auto">' + c.prompts.slice().reverse().map(function (p) {
        return '<div class="ver' + (p.v === c.promptActive ? ' on' : '') + '"><b>v' + p.v + '</b><span class="meta" style="flex:1">' + esc(p.note || '(메모 없음)') + ' · ' + dt(p.at) + '</span>' + (p.v === c.promptActive ? '<span class="badge b-on">사용 중</span>' : '<button class="btn sm" data-act="useP" data-v="' + p.v + '">이 버전 쓰기</button>') + '<button class="btn sm" data-act="editP" data-v="' + p.v + '">불러오기</button></div>';
      }).join('') + '</div></div></div>' +
      '<div class="card sec"><div class="row"><h3 style="margin:0">프롬프트 고치기</h3><span class="meta">지금 불러온 버전: v' + ed.v + '</span><span class="sp"></span><button class="btn sm" data-act="defP">처음 기본값 불러오기</button></div>' +
      '<p class="meta">시스템 프롬프트는 AI가 꼭 지킬 규칙이에요. "자료에 없는 내용은 쓰지 않는다"는 규칙은 지우지 말아 주세요. 요청 틀에는 {title} {grade} {subject} {kind} {req} {count} {plan} {files}를 쓸 수 있어요. 결과 모양(JSON 도구)은 화면과 맞춰져 있어 여기서 바꾸지 않아요.</p>' +
      '<label class="f" for="p-sys">시스템 프롬프트</label><textarea class="in" id="p-sys" rows="18">' + esc(ed.system) + '</textarea>' +
      '<label class="f" for="p-user" style="margin-top:10px">요청 틀</label><textarea class="in" id="p-user" rows="10">' + esc(ed.user) + '</textarea>' +
      '<div class="row" style="margin-top:10px"><input class="in" id="p-note" style="flex:1" placeholder="이 버전 메모 (예: 확인 문제 난이도 낮춤)"><button class="btn primary" data-act="saveP">새 버전으로 저장하고 쓰기</button></div>' +
      '<details style="margin-top:12px"><summary class="meta">결과 모양 (JSON 도구 정의) 보기</summary><pre>' + esc(JSON.stringify(D.tool, null, 2)) + '</pre></details></div>';
  }

  /* ---------- 제한 설정 ---------- */
  function vLimits() {
    var D = S.set; if (!D) return '<p class="empty">불러오는 중…</p>';
    var c = D.cfg, g = c.global;
    return '<div class="card"><h3>선생님 기본 제한</h3><p class="meta" style="margin:-4px 0 12px">모든 선생님에게 적용돼요. 특정 선생님만 다르게 하려면 <b>선생님</b> 탭에서 그 선생님을 눌러 정해요.</p><div class="fgrid">' +
      Object.keys(LIM).map(function (k) { return '<div><label class="f" for="gl-' + k + '">' + LIM[k][0] + ' (' + LIM[k][1] + ')</label><input class="in" id="gl-' + k + '" data-gl="' + k + '" inputmode="numeric" value="' + c.limits[k] + '"></div>'; }).join('') +
      '</div></div>' +
      '<div class="card sec"><h3>서비스 전체</h3><div class="fgrid">' +
      '<div><label class="f" for="gg-budget">AI 한 달 예산 (달러)</label><input class="in" id="gg-budget" inputmode="decimal" value="' + g.monthlyBudgetUSD + '"><div class="meta">넘으면 AI 만들기를 멈춰요</div></div>' +
      '<div><label class="f" for="gg-stu">동시 접속 학생 최대 (전체)</label><input class="in" id="gg-stu" inputmode="numeric" value="' + g.maxTotalStudents + '"><div class="meta">서버 보호용. 넘으면 새 학생 입장을 막아요</div></div>' +
      '<div><label class="f" for="gg-conc">AI 동시 생성 수</label><input class="in" id="gg-conc" inputmode="numeric" value="' + g.aiConcurrent + '"><div class="meta">한꺼번에 몰릴 때 서버 보호</div></div>' +
      '<div><label class="f" for="gg-chars">자료 글 최대 (자)</label><input class="in" id="gg-chars" inputmode="numeric" value="' + g.maxTextChars + '"><div class="meta">워드·PPT·한글에서 뽑는 글 길이 (비용 조절)</div></div>' +
      '</div><div style="margin-top:14px" class="grid">' +
      '<label class="chk"><input type="checkbox" id="gg-signup"' + (g.signupOpen ? ' checked' : '') + '> 회원가입 받기</label>' +
      '<div><label class="f" for="gg-dom">바로 승인할 학교 이메일 도메인</label><input class="in" id="gg-dom" placeholder="예) sen.go.kr, goe.go.kr" value="' + esc((g.autoApproveDomains || []).join(', ')) + '"><div class="meta">이 도메인 이메일로 인증을 마치면 관리자 승인 없이 바로 열려요. 비워 두면 모두 직접 승인해요. 하위 도메인도 포함돼요.</div></div>' +
      '</div><div class="row" style="margin-top:14px"><span class="sp"></span><button class="btn primary" data-act="saveLimits">모두 저장</button></div></div>';
  }

  /* ---------- 메일함 ---------- */
  function vMail() {
    var M = S.mails; if (!M) return '<p class="empty">불러오는 중…</p>';
    return (M.mode === 'test' ? '<p class="warnbox">RESEND_API_KEY가 없어 메일을 실제로 보내지 않고 여기에만 남겨요. 인증 링크를 눌러 대신 인증하거나, 선생님 탭에서 바로 승인할 수 있어요.</p>' : '') +
      '<div class="card"><div class="row"><span>보내는 주소: <b>' + esc(M.from) + '</b> · <span class="badge ' + (M.mode === 'live' ? 'b-on">Resend 연결됨' : 'b-off">시범 모드') + '</span></span><span class="sp"></span><input class="in" id="mt-to" style="width:240px" placeholder="시험 메일 받을 주소"><button class="btn" data-act="mailTest">시험 메일 보내기</button></div></div>' +
      '<div class="card sec" style="padding:0"><div class="tw"><table><thead><tr><th>때</th><th>종류</th><th>받는 사람</th><th>제목</th><th>결과</th><th>링크</th></tr></thead><tbody>' +
      (M.mails.length ? M.mails.map(function (m) {
        var K = { verify: '가입 인증', approved: '승인 안내', reset: '비밀번호', admin: '관리자 알림', test: '시험' };
        return '<tr><td>' + when(m.at) + '</td><td>' + (K[m.kind] || m.kind) + '</td><td>' + esc(m.to) + '</td><td>' + esc(m.subject) + '</td><td>' + (m.mode === 'test' ? '<span class="badge b-test">보내지 않음</span>' : m.ok ? '<span class="badge b-on">보냄</span>' : '<span class="badge b-error">실패</span><div class="meta">' + esc(m.error) + '</div>') + '</td><td>' + (m.link ? '<a href="' + esc(m.link) + '" target="_blank" rel="noopener">열기</a>' : '') + '</td></tr>';
      }).join('') : '<tr><td colspan="6" class="empty">아직 보낸 메일이 없어요</td></tr>') + '</tbody></table></div></div>';
  }

  /* ---------- 동작 ---------- */
  function act(id, body) { return post('/api/admin/teachers/' + id, body).then(function (d) { if (!d.ok) { toast(d.error || '하지 못했어요'); return d; } return get('/api/admin/teachers').then(function (x) { S.teachers = x.teachers; if (tab === 'teachers') render(); if (drawerT && !d.deleted) openTeacher(drawerT); return d; }); }); }
  document.addEventListener('click', function (e) {
    if (e.target.closest('[data-close]')) return closeDrawer();
    var tf = e.target.closest('[data-tf]'); if (tf) { S.tFilter = tf.dataset.tf; render(); return; }
    var b = e.target.closest('[data-act]');
    if (b) {
      var a = b.dataset.act, id = b.dataset.id;
      e.stopPropagation();
      if (a === 'approve') return act(id, { action: 'approve', force: true }).then(function (d) { if (d.ok) toast('승인했어요. 선생님께 안내 메일을 보냈어요'); });
      if (a === 'suspend') { if (confirm('이 계정을 멈출까요? 지금 로그인된 기기도 모두 로그아웃돼요.')) act(id, { action: 'suspend' }).then(function (d) { if (d.ok) toast('멈췄어요'); }); return; }
      if (a === 'verify') return act(id, { action: 'verify' }).then(function (d) { if (d.ok) toast('메일 인증으로 처리했어요'); });
      if (a === 'resend') return act(id, { action: 'resend' }).then(function (d) { if (d.ok) toast('인증 메일을 다시 보냈어요 (메일함 확인)'); });
      if (a === 'logoutT') return act(id, { action: 'logout' }).then(function (d) { if (d.ok) toast('모든 기기에서 로그아웃시켰어요'); });
      if (a === 'setpw') { var pw = prompt('새 비밀번호 (8자 이상). 선생님께 따로 알려 주세요.'); if (pw) act(id, { action: 'setpw', pw: pw }).then(function (d) { if (d.ok) toast('비밀번호를 바꿨어요'); }); return; }
      if (a === 'note') return act(id, { action: 'note', note: $('#t-note').value }).then(function (d) { if (d.ok) toast('메모를 저장했어요'); });
      if (a === 'limitsT') { var L = {}; Array.prototype.forEach.call(document.querySelectorAll('[data-tl]'), function (i) { L[i.dataset.tl] = i.value.trim(); }); return act(id, { action: 'limits', limits: L }).then(function (d) { if (d.ok) toast('이 선생님의 제한을 저장했어요'); }); }
      if (a === 'delT') { var ok = prompt('계정과 이 선생님의 모든 콘텐츠·수업 기록을 지워요. 되돌릴 수 없어요.\n지우려면 아래 칸에 계정 번호 ' + id + ' 를 그대로 적어 주세요.'); if (ok === id) act(id, { action: 'delete', confirm: id }).then(function (d) { if (d.ok) { closeDrawer(); toast('계정을 지웠어요'); } }); return; }
      if (a === 'lesson') return openLesson(b.dataset.tid, id);
      if (a === 'addT') {
        var em = prompt('선생님 이메일'); if (!em) return;
        var nm = prompt('이름') || ''; var sc = prompt('학교 이름') || ''; var p2 = prompt('임시 비밀번호 (8자 이상)'); if (!p2) return;
        post('/api/admin/teachers', { email: em, name: nm, school: sc, pw: p2 }).then(function (d) { if (!d.ok) return toast(d.error || '만들지 못했어요'); toast('계정을 만들었어요. 이메일과 임시 비밀번호를 선생님께 알려 주세요'); load(false); });
        return;
      }
      if (a === 'saveModel') {
        return post('/api/admin/settings', { ai: { model: $('#m-model').value, maxTokens: $('#m-max').value, temperature: $('#m-temp').value.trim() }, global: { aiEnabled: $('#m-on').checked } }).then(function (d) { if (d.ok) { S.set.cfg = d.cfg; toast('모델 설정을 저장했어요'); render(); } else toast(d.error || '저장하지 못했어요'); });
      }
      if (a === 'useP') return post('/api/admin/prompts', { activate: +b.dataset.v }).then(function (d) { if (d.ok) { S.set.cfg = d.cfg; S.pEdit = null; toast('v' + b.dataset.v + '를 쓰도록 바꿨어요'); render(); } });
      if (a === 'editP') { S.pEdit = S.set.cfg.prompts.filter(function (p) { return p.v === +b.dataset.v; })[0]; render(); return; }
      if (a === 'defP') { S.pEdit = { v: '기본', system: S.set.defaults.system, user: S.set.defaults.user }; render(); return; }
      if (a === 'saveP') return post('/api/admin/prompts', { system: $('#p-sys').value, user: $('#p-user').value, note: $('#p-note').value }).then(function (d) { if (d.ok) { S.set.cfg = d.cfg; S.pEdit = null; toast('새 버전을 저장하고 쓰도록 했어요'); render(); } else toast(d.error || '저장하지 못했어요'); });
      if (a === 'saveLimits') {
        var GL = {}; Array.prototype.forEach.call(document.querySelectorAll('[data-gl]'), function (i) { GL[i.dataset.gl] = i.value.trim(); });
        return post('/api/admin/settings', { limits: GL, global: { monthlyBudgetUSD: $('#gg-budget').value, maxTotalStudents: $('#gg-stu').value, aiConcurrent: $('#gg-conc').value, maxTextChars: $('#gg-chars').value, signupOpen: $('#gg-signup').checked, autoApproveDomains: $('#gg-dom').value } }).then(function (d) { if (d.ok) { S.set.cfg = d.cfg; toast('저장했어요'); render(); } else toast(d.error || '저장하지 못했어요'); });
      }
      if (a === 'mailTest') return post('/api/admin/mail-test', { to: $('#mt-to').value }).then(function (d) { toast(d.ok ? (d.mail.mode === 'test' ? '시범 모드라 메일함에만 남겼어요' : '보냈어요') : (d.error || (d.mail && d.mail.error) || '보내지 못했어요')); get('/api/admin/mails').then(function (x) { S.mails = x; render(); }); });
      return;
    }
    var lg = e.target.closest('[data-log]'); if (lg) return openLog(lg.dataset.log);
    var op = e.target.closest('[data-open]');
    if (op) {
      if (op.hasAttribute('data-go-teachers') || !S.teachers) { get('/api/admin/teachers').then(function (x) { S.teachers = x.teachers; openTeacher(op.dataset.open); }); return; }
      return openTeacher(op.dataset.open);
    }
  });
  document.addEventListener('input', function (e) { if (e.target.id === 'tq') { S.tq = e.target.value; var pos = e.target.selectionStart; render(); var q = $('#tq'); q.focus(); q.setSelectionRange(pos, pos); } });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#drawer').innerHTML) closeDrawer(); });

  /* 시작: 로그인 상태 확인 */
  get('/api/admin/overview').then(function (d) { S.ov = d; start(); }).catch(function () {});
})();
</script>
</body>
</html>
