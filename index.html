<!doctype html><html lang="ko"><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<script src="/socket.io/socket.io.js"></script>
<script>
/* 위아 서버 연결: 수업 상태(wia-live)·학생 기록(wia-stu:*)·선생님 데이터는 서버와 실시간으로 맞춰요. */
(function () {
  var SYNC = function (k) { return k === 'wia-live' || k === 'wia-teacher-draft-v5' || k.indexOf('wia-stu:') === 0; };
  var cache = {}, info = { teacher: false, me: '', offline: false }, real = null;
  try { real = window.localStorage; } catch (e) {}
  var stu = null; try { stu = JSON.parse(sessionStorage.getItem('wia-student') || 'null'); } catch (e) {}
  function xhr(method, url, body) {
    var x = new XMLHttpRequest(), d = null;
    try { x.open(method, url, false); if (body) x.setRequestHeader('Content-Type', 'application/json'); x.send(body ? JSON.stringify(body) : null); } catch (e) { return { status: 0, data: null }; }
    try { d = JSON.parse(x.responseText); } catch (e) {}
    return { status: x.status, data: d };
  }
  var q = stu && stu.code ? '?code=' + encodeURIComponent(stu.code) + '&sid=' + encodeURIComponent(stu.sid || '') : '';
  var snap = xhr('GET', '/api/snapshot' + q);
  if (snap.data) { cache = snap.data.kv || {}; info.teacher = !!snap.data.teacher; info.me = snap.data.me || ''; } else info.offline = true;
  function keys() { var ks = Object.keys(cache); if (real) for (var i = 0; i < real.length; i++) { var k = real.key(i); if (k && !SYNC(k) && ks.indexOf(k) < 0) ks.push(k); } return ks; }
  var socket = window.io ? io({ auth: stu && stu.code ? { code: stu.code, sid: stu.sid } : {}, transports: ['websocket', 'polling'], reconnectionDelayMax: 3000 }) : null;
  var store = {
    getItem: function (k) { k = String(k); if (SYNC(k)) return Object.prototype.hasOwnProperty.call(cache, k) ? cache[k] : null; return real ? real.getItem(k) : null; },
    setItem: function (k, v) { k = String(k); v = String(v); if (SYNC(k)) { if (cache[k] === v) return; cache[k] = v; if (socket) socket.emit('set', { key: k, value: v }); return; } if (real) real.setItem(k, v); },
    removeItem: function (k) { k = String(k); if (SYNC(k)) { if (!Object.prototype.hasOwnProperty.call(cache, k)) return; delete cache[k]; if (socket) socket.emit('del', { key: k }); return; } if (real) real.removeItem(k); },
    key: function (i) { return keys()[i] || null; }
  };
  Object.defineProperty(store, 'length', { get: function () { return keys().length; } });
  function changed(k, v) { try { window.dispatchEvent(new StorageEvent('storage', { key: k, newValue: v })); } catch (e) {} }
  /* 연결 상태 표시 */
  var bar = null;
  function conn(ok) {
    if (!bar) { bar = document.createElement('div'); bar.id = 'wia-conn'; bar.setAttribute('role', 'status'); bar.style.cssText = 'position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:99;background:#c23535;color:#fff;font:600 15px/1.4 system-ui,sans-serif;padding:10px 18px;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.2)'; bar.textContent = '연결이 끊겼어요 · 다시 연결하는 중…'; (document.body || document.documentElement).appendChild(bar); }
    bar.hidden = ok;
  }
  if (socket) {
    var first = true;
    socket.on('kv', function (m) { if (!m || typeof m.key !== 'string' || !SYNC(m.key)) return; if (m.value === null) delete cache[m.key]; else cache[m.key] = m.value; changed(m.key, m.value); });
    socket.on('connect', function () {
      conn(true);
      if (first) { first = false; return; }
      /* 끊긴 사이에 바뀐 것을 다시 받아요 (선생님: 학생 기록 / 학생: 수업 상태) */
      fetch('/api/snapshot' + q, { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (d) {
        var kv = (d && d.kv) || {};
        if (info.teacher) {
          Object.keys(cache).forEach(function (k) { if (k.indexOf('wia-stu:') === 0 && !(k in kv)) { delete cache[k]; changed(k, null); } });
          Object.keys(kv).forEach(function (k) { if (k.indexOf('wia-stu:') === 0 && cache[k] !== kv[k]) { cache[k] = kv[k]; changed(k, kv[k]); } });
        } else if (kv['wia-live'] && cache['wia-live'] !== kv['wia-live']) { cache['wia-live'] = kv['wia-live']; changed('wia-live', kv['wia-live']); }
      }).catch(function () {});
    });
    socket.on('disconnect', function () { conn(false); });
    socket.on('connect_error', function () { conn(false); });

    if (!socket || !socket.connected) { cb(false); return; }
    var done = false, t = setTimeout(function () { if (!done) { done = true; cb(false); } }, 5000);
    socket.emit('sync-check', function () { if (!done) { done = true; clearTimeout(t); cb(true); } });
  }
  window.WIA_SRV = { info: info, xhr: xhr, socket: socket, confirm: confirm };
})();
</script>

<title>위아 WIA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* Layout: 상단 탭(학생/교사) + 태블릿 비율의 활동 프레임. 학습지의 '형광펜 빈칸'과 채팅 말풍선이 핵심 모티프. */
:root {
  --bg: #dbe8ff;
  --surface: #ffffff;
  --surface-2: #f3f7ff;
  --ink: #1d2447;
  --muted: #5d6b8f;
  --line: #d9e4f8;
  --accent: #3b82f6;
  --accent-ink: #ffffff;
  --accent-d: #1f5fd1;
  --good-solid: #58cc02;
  --mark: #ffe082;
  --mark-ink: #3b3000;
  --good: #1c8c3c;
  --good-bg: #dcf7d6;
  --warn: #a85a00;
  --warn-bg: #ffefd2;
  --weak: #c23535;
  --weak-bg: #ffe3e1;
  --sky: #dbeafe; --sky-ink: #1e4fb8;
  --mint: #d6f4e6; --mint-ink: #0f6b43;
  --pink: #ffe0ea; --pink-ink: #9a2149;
  --sky-top: #bfe6ff; --sky-bot: #e6e9ff; --logo: #3b82f6; --logo-a: #67c4ff; --logo-b: #3b82f6; --dot: #22d3ee;
  --cloud: #c9b8f5; --cloud-hi: #ebe4ff; --cloud-d: #ac98ee; --sprout: #d7cbf8; --sprout-d: #b9a5f0; --eye: #1d1730;
  --font: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media not all {
  :root:not([data-theme="light"]) {
    --bg: #0d1630; --surface: #162040; --surface-2: #1d2a52; --ink: #e9efff; --muted: #a5b3d4;
    --line: #2d3d6e; --accent: #6ea4ff; --accent-ink: #0b1330; --accent-d: #3f74dc; --mark: #6d5b0f; --mark-ink: #fff3b3;
    --good: #66d6a0; --good-bg: #123022; --warn: #ffb85c; --warn-bg: #3a2a10; --weak: #ff9d94; --weak-bg: #3b1d1d;
    --sky: #213a72; --sky-ink: #c3d8ff; --mint: #14382a; --mint-ink: #8ce3b8; --pink: #4a2234; --pink-ink: #ffb3cd;
    --sky-top: #0c1735; --sky-bot: #1f2d66; --logo: #8fb8ff; --logo-a: #9fd4ff; --logo-b: #6ea4ff; --dot: #4fe0f5; --cloud: #bba9f2; --cloud-hi: #dcd2fa; --cloud-d: #a18be6; --sprout: #c8baf3; --sprout-d: #ae9aea;
    color-scheme: dark;
  }
}
:root[data-theme="wia-off"] {
  --bg: #0d1630; --surface: #162040; --surface-2: #1d2a52; --ink: #e9efff; --muted: #a5b3d4;
  --line: #2d3d6e; --accent: #6ea4ff; --accent-ink: #0b1330; --accent-d: #3f74dc; --mark: #6d5b0f; --mark-ink: #fff3b3;
  --good: #66d6a0; --good-bg: #123022; --warn: #ffb85c; --warn-bg: #3a2a10; --weak: #ff9d94; --weak-bg: #3b1d1d;
  --sky: #213a72; --sky-ink: #c3d8ff; --mint: #14382a; --mint-ink: #8ce3b8; --pink: #4a2234; --pink-ink: #ffb3cd;
  --sky-top: #0c1735; --sky-bot: #1f2d66; --logo: #8fb8ff; --logo-a: #9fd4ff; --logo-b: #6ea4ff; --dot: #4fe0f5; --cloud: #bba9f2; --cloud-hi: #dcd2fa; --cloud-d: #a18be6; --sprout: #c8baf3; --sprout-d: #ae9aea;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg) linear-gradient(180deg, var(--sky-top), var(--sky-bot)) fixed; color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; padding-inline: 16px; padding-block: 20px 48px; word-break: keep-all; }
.wrap { position: relative; z-index: 1; max-width: 1080px; margin-inline: auto; display: flex; flex-direction: column; gap: 18px; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; flex-direction: column; min-width: 0; }
.brand b { font-size: 18px; font-weight: 700; }
.brand span { font-size: 13px; color: var(--muted); }
.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 4px; }
.tab { border: 0; background: transparent; padding: 9px 18px; border-radius: 7px; font-weight: 500; min-height: 44px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.draft { font-size: 12px; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; }

/* tablet frame */
.frame { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; overflow: clip; display: flex; flex-direction: column; min-height: max(720px, calc(100dvh - 120px)); box-shadow: 0 10px 40px color-mix(in srgb, var(--ink) 7%, transparent); }
.prog { display: flex; align-items: center; gap: 18px; padding: 20px 36px; background: var(--surface); flex-wrap: wrap; }
.segs { display: flex; gap: 5px; flex: 1; min-width: 160px; }
.seg { height: 6px; flex: 1; border-radius: 3px; background: var(--line); }
.seg.done { background: var(--accent); }
.seg.now { background: var(--accent); opacity: .55; }
.prog-l { font-size: 15px; font-weight: 500; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.body { padding: 24px 48px 32px; flex: 1; display: flex; flex-direction: column; gap: 30px; min-width: 0; }
.body > * { width: 100%; max-width: 840px; margin-inline: auto; }
.body.center { justify-content: center; }
.eyebrow { font-size: 15px; font-weight: 700; color: var(--accent); letter-spacing: .03em; }
.foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 36px 28px; flex-wrap: wrap; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
h2 { font-size: 34px; font-weight: 700; line-height: 1.35; }
h3 { font-size: 20px; font-weight: 700; }
.lead { font-size: 23px; color: var(--muted); margin-block: 0; }
.btn { min-height: 42px; padding: 0 22px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-weight: 700; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--muted); font-weight: 500; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field.narrow { max-width: 480px; }
.field label { font-size: 15px; font-weight: 500; color: var(--muted); }
.input, textarea { font: inherit; font-size: 24px; padding: 14px 18px; border: 2px solid var(--line); border-radius: 16px; background: var(--surface); color: var(--ink); width: 100%; min-height: 62px; }
textarea { resize: vertical; min-height: 170px; line-height: 1.6; }
.input:focus, textarea:focus { border-color: var(--accent); outline: none; }

/* step 2: 오늘의 숙제 */
.hwc { position: relative; border: 2px dashed var(--line); border-radius: 28px; padding: 56px 44px 48px; background: var(--surface-2); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center; margin-top: 8px; }
.sticker { position: absolute; top: -17px; left: 30px; background: var(--mark); color: var(--mark-ink); font-weight: 700; font-size: 16px; padding: 4px 16px; border-radius: 8px; transform: rotate(-3deg); }
.hwc-main { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font-size: 17px; font-weight: 700; padding: 4px 16px; border-radius: 999px; }
.tag.sky { background: var(--sky); color: var(--sky-ink); }
.tag.mint { background: var(--mint); color: var(--mint-ink); }
.tag.pink { background: var(--pink); color: var(--pink-ink); }
.tag.lemon { background: var(--mark); color: var(--mark-ink); }
.hw-t { font-size: 38px; font-weight: 700; line-height: 1.4; margin-block: 0; text-wrap: balance; }
.hl-mark { background: linear-gradient(transparent 58%, var(--mark) 58%); padding-inline: 2px; }
.cup { width: 160px; height: auto; flex: none; overflow: visible; }
.gray { text-align: center; font-size: 24px; color: var(--muted); margin-block: 10px 0; }

/* step 3: 빈칸 문장 */
.sentence { font-size: 32px; line-height: 2.2; padding: 32px 36px; border-radius: 24px; background: var(--surface-2); }
.blank { font: inherit; font-size: .9em; border: 2px solid var(--line); background: var(--surface); color: var(--muted); padding: 0 18px; border-radius: 12px; font-weight: 500; min-height: 52px; line-height: 1.2; vertical-align: middle; margin-inline: 2px; }
.blank.empty { border-style: dashed; }
.blank.filled { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--accent); font-weight: 700; }
.blank.active { border-color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); }
.opts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.opts-l { font-size: 16px; font-weight: 700; color: var(--muted); width: 100%; }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 22px; font-size: 19px; min-height: 46px; }
.opt:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); font-weight: 700; }
.fb { border-radius: 18px; padding: 18px 24px; display: flex; gap: 14px; align-items: flex-start; font-size: 21px; line-height: 1.6; }
.fb b { flex: none; font-size: 14px; padding: 2px 10px; border-radius: 6px; margin-top: 4px; background: var(--surface); }
.fb.good { background: var(--good-bg); } .fb.good b { color: var(--good); }
.fb.ok { background: var(--warn-bg); } .fb.ok b { color: var(--warn); }
.fb.weak { background: var(--weak-bg); } .fb.weak b { color: var(--weak); }
.fb.hint { background: var(--surface-2); color: var(--muted); }

/* step 4: 채팅 */
.chat { display: flex; flex-direction: column; gap: 14px; }
.me { align-self: flex-end; max-width: min(100%, 620px); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
.bubble { background: var(--accent); color: var(--accent-ink); border-radius: 26px 26px 6px 26px; padding: 22px 28px; font-size: 25px; line-height: 1.8; }
.seg-p { border-radius: 5px; padding: 1px 3px; }
.seg-p.hl { background: var(--mark); color: var(--mark-ink); font-weight: 700; }
.who { font-size: 14px; color: var(--muted); }
.aiRow { display: flex; gap: 12px; align-items: flex-start; }
.av { flex: none; width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--surface); font-size: 13px; font-weight: 700; display: grid; place-items: center; }
.typing { display: flex; align-items: center; gap: 14px; padding: 10px 0; color: var(--muted); font-size: 21px; }
.dots { display: inline-flex; gap: 5px; }
.dots i { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); display: block; }
.prov { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 3; display: flex; gap: 10px; align-items: flex-start; border: 2px dashed var(--line); background: var(--surface); border-radius: 18px; padding: 14px 20px; font-size: 20px; color: var(--muted); }
.prov .pv-t { flex: none; font-size: 14px; font-weight: 700; background: var(--mark); color: var(--mark-ink); padding: 2px 8px; border-radius: 5px; margin-top: 3px; }
.prov.has { border-style: solid; border-color: var(--accent); color: var(--ink); }
.ai { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; position: relative; padding-top: 4px; }
.ai-badge { align-self: flex-end; font-size: 12px; background: var(--surface-2); border: 1px dashed var(--line); padding: 1px 8px; border-radius: 5px; color: var(--muted); }
.blk { cursor: pointer; display: block; min-width: 0; padding: 8px 14px; margin-inline: -14px; border-radius: 12px; box-shadow: inset 3px 0 0 transparent; }
.blk:hover { background: var(--surface-2); }
.w { display: none; }
.w.on { display: inline; }
.streaming .blk:not(:has(.w.on)), .streaming li:not(:has(.w.on)), .streaming tr:not(:has(.w.on)) { display: none; }
.blk.seen { box-shadow: inset 3px 0 0 color-mix(in srgb, var(--accent) 40%, transparent); }
.blk.on { background: color-mix(in srgb, var(--accent) 9%, var(--surface)); box-shadow: inset 3px 0 0 var(--accent); }
.blk p { margin: 0; font-size: 23px; line-height: 1.85; }
.blk ol, .blk ul { margin: 0; padding-left: 28px; display: grid; gap: 10px; font-size: 23px; line-height: 1.7; }
.blk table { border-collapse: collapse; width: 100%; font-size: 21px; }
.blk th, .blk td { border: 1px solid var(--line); padding: 8px 12px; text-align: left; }
.blk th { background: var(--surface-2); }
.tbl { overflow-x: auto; }
.blk.src { font-size: 19px; color: var(--muted); line-height: 1.7; }
.blk.ghost { color: var(--muted); font-size: 19px; font-style: italic; }
.mock { flex: 1; min-width: 0; border-radius: 6px 28px 28px 28px; padding: 36px 40px; position: relative; background: var(--surface-2); }
.mock p { margin: 0; font-size: 32px; line-height: 1.8; }
.mock .ai-badge { position: absolute; top: 12px; right: 18px; align-self: auto; }
.tgt { background: linear-gradient(transparent 62%, var(--mark) 62%); font-weight: 700; padding: 0 4px; }

.composer { border: 2px solid var(--line); border-radius: 24px; padding: 24px 30px 28px; background: var(--surface-2); display: flex; flex-direction: column; gap: 10px; }
.composer p { margin: 0; font-size: 30px; line-height: 1.7; }
.comp-l { font-size: 14px; font-weight: 700; color: var(--muted); }
.gray.left { text-align: left; font-size: 21px; margin-block: 4px 0; }
.pause { border: 2px dashed var(--line); border-radius: 20px; padding: 18px 24px; color: var(--muted); font-size: 21px; text-align: center; }
/* step 5: 확인 (한 번에 하나) */
.pick-row { display: flex; flex-wrap: wrap; gap: 12px; }
.pbtn { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 26px; font-size: 20px; font-weight: 700; min-height: 50px; }
.pbtn:hover:not(:disabled) { border-color: var(--accent); }
.pbtn.right { border-color: var(--good); background: var(--good-bg); color: var(--good); }
.pbtn.wrong { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.pbtn.dim { opacity: .45; }
.q-big { font-size: 34px; font-weight: 700; line-height: 1.4; margin-block: 0; text-wrap: balance; }

/* step 6: 선생님 질문 / 복습 */
.tq { border: 2px solid var(--accent); border-radius: 24px; padding: 28px 32px; display: flex; flex-direction: column; gap: 8px; background: color-mix(in srgb, var(--accent) 6%, var(--surface)); }
.tq-tag { align-self: flex-start; font-size: 14px; font-weight: 700; background: var(--accent); color: var(--accent-ink); padding: 2px 10px; border-radius: 6px; }
.tq-q { margin: 0; font-size: 28px; font-weight: 500; line-height: 1.6; }
.rv-list { display: grid; gap: 12px; }
.rv { border-radius: 22px; padding: 22px 28px; display: grid; gap: 8px; background: var(--surface-2); }
.rv-h { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; }
.rv-n { font-size: 13px; font-weight: 700; color: var(--muted); }
.rv-q { font-weight: 700; font-size: 23px; }
.rv-t { margin: 0; font-size: 22px; }
.rv-next { margin: 0; font-size: 19px; color: var(--muted); }
.chip { font-size: 14px; font-weight: 500; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); }
.done-box { text-align: center; padding: 34px 24px; border: 2px dashed var(--accent); border-radius: 24px; display: grid; gap: 8px; }
.done-box h3 { font-size: 26px; }
.note { font-size: 14px; color: var(--muted); margin: 0; }

/* teacher: 메인 → 학년 → 과목 → 주제 → 수업. 프로젝터로 띄우는 화면이라 코드는 크게. */
#view-teacher { display: flex; flex-direction: column; gap: 18px; }
.body.wide > * { max-width: none; }
.hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 14px; }
.hero .cup { width: 150px; }
.wordmark { font-size: 76px; font-weight: 700; line-height: 1; letter-spacing: -.02em; }
.hero-sub { margin: 0; font-size: 24px; color: var(--muted); }
.hero-steps { list-style: none; margin: 18px 0 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 6px; counter-reset: hs; }
.hero-steps li { counter-increment: hs; font-size: 16px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.hero-steps li::before { content: counter(hs); width: 24px; height: 24px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; }
.hero-steps li + li::after { content: none; }
.hero-steps li:not(:last-child)::after { content: "→"; margin-left: 6px; color: var(--line); }
.choice-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.choice { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 24px; padding: 26px 28px; display: flex; flex-direction: column; gap: 6px; min-height: 140px; justify-content: flex-end; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice-t { font-size: 40px; font-weight: 700; line-height: 1.2; }
.choice-d { font-size: 17px; color: var(--muted); }
.choice:disabled { opacity: .5; cursor: not-allowed; }
.choice .chip { align-self: flex-start; }
.choice.c-pink { background: var(--pink); border-color: transparent; } .choice.c-pink .choice-t { color: var(--pink-ink); }
.choice.c-mint { background: var(--mint); border-color: transparent; } .choice.c-mint .choice-t { color: var(--mint-ink); }
.choice.c-sky { background: var(--sky); border-color: transparent; } .choice.c-sky .choice-t { color: var(--sky-ink); }
.choice[class*="c-"]:hover:not(:disabled) { box-shadow: 0 0 0 3px var(--accent) inset; }
.grp { display: grid; gap: 12px; }
.grp-h { display: flex; align-items: baseline; gap: 6px 12px; flex-wrap: wrap; }
.ex-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 12px; }
.exc { text-align: left; border: 2px solid var(--line); background: var(--surface); border-radius: 20px; padding: 18px 22px; display: flex; flex-direction: column; gap: 12px; font-size: 20px; font-weight: 700; line-height: 1.45; min-height: 116px; justify-content: space-between; }
.exc:hover { border-color: var(--accent); }
.exc .chip { align-self: flex-start; font-weight: 500; }
.t-sum { display: flex; flex-wrap: wrap; gap: 8px; }
.t-sum .tag { font-size: 15px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 14px; padding: 12px 18px; font-size: 15px; }
.s-grid { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.t-col { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 26px 28px; display: flex; flex-direction: column; gap: 20px; min-width: 0; box-shadow: 0 6px 24px color-mix(in srgb, var(--ink) 5%, transparent); }
.c-h { display: flex; align-items: center; gap: 12px; }
.c-n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--ink); color: var(--surface); font-weight: 700; font-size: 14px; display: grid; place-items: center; }
.code-body { display: flex; gap: 28px; align-items: center; flex-wrap: wrap; }
.code-body > div:last-child { flex: 1; min-width: 200px; }
.qr { flex: none; width: 150px; height: 150px; color: var(--ink); }
.qr svg { width: 100%; height: 100%; display: block; }
.code-l { font-size: 14px; font-weight: 700; color: var(--muted); }
.code-n { font-size: 66px; font-weight: 700; letter-spacing: .1em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.code-note { margin: 6px 0 0; color: var(--muted); font-size: 16px; }
.join { border-top: 1px solid var(--line); padding-top: 18px; display: grid; gap: 14px; }
.join-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.join-l { display: flex; align-items: baseline; gap: 10px; font-size: 17px; font-weight: 500; }
.j-n { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.live { width: 10px; height: 10px; border-radius: 50%; background: var(--good); align-self: center; }
.nicks { display: flex; flex-wrap: wrap; gap: 8px; }
.nk { background: var(--surface-2); border-radius: 999px; padding: 5px 14px; font-size: 16px; }
.nk.me { background: var(--sky); color: var(--sky-ink); font-weight: 700; }
.tl-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.bar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; transition: width .4s; }
.guide { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.guide li { position: relative; padding-left: 46px; }
.guide li::before { content: ""; position: absolute; left: 13px; top: 36px; bottom: -4px; width: 2px; background: var(--line); }
.guide li:last-child::before { display: none; }
.dot { position: absolute; left: 0; top: 6px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 700; color: var(--muted); display: grid; place-items: center; }
.guide li.done .dot { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.guide li.now .dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent); }
.gt { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; background: transparent; border: 0; padding: 8px 0; text-align: left; font-size: 17px; font-weight: 500; min-height: 40px; }
.guide li.now .gt { font-weight: 700; }
.m { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.say { display: none; margin: 0 0 12px; font-size: 16px; color: var(--muted); background: var(--surface-2); border-radius: 12px; padding: 12px 16px; line-height: 1.7; }
.guide li.now .say, .guide li.open .say { display: block; }
.guide li.now .say { color: var(--ink); background: color-mix(in srgb, var(--accent) 9%, var(--surface)); }
.seg-tabs { display: inline-flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); padding: 4px; border-radius: 10px; align-self: flex-start; flex-wrap: wrap; }
.seg-tabs button { border: 0; background: transparent; padding: 8px 16px; border-radius: 7px; min-height: 44px; font-weight: 500; }
.seg-tabs button[aria-pressed="true"] { background: var(--surface); box-shadow: 0 0 0 2px var(--accent) inset; font-weight: 700; }
.memo { border: 1px dashed var(--line); border-radius: 16px; padding: 14px 20px; color: var(--muted); }
.memo summary { cursor: pointer; font-weight: 500; font-size: 15px; }
.open-q { display: grid; gap: 8px; margin: 12px 0 4px; padding-left: 20px; font-size: 15px; }

/* ===== 위아 스타일: 동글동글, 두툼한 버튼, 캐릭터 안내 ===== */
:root { --disp: "Jua", "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
h1, h2, h3, .wordmark, .btn, .tag, .choice-t, .hw-t, .q-big, .opt, .pbtn, .blank, .tab, .eyebrow, .j-n, .code-n, .foot-t, .brand b, .exc, .seg-tabs button, .prog-l, .sticker, .tq-tag, .coach-b, .av { font-family: var(--disp); font-weight: 400; }
.opt.sel, .tab[aria-selected="true"], .seg-tabs button[aria-pressed="true"], .blank.filled, .tchip[aria-pressed="true"] { font-weight: 400; }
.brand { flex-direction: column; gap: 2px; }
.brand-row { display: flex; align-items: center; gap: 10px; }
.brand b { font-size: 30px; line-height: 1; }
.cup.cup-logo { width: 34px; animation: none; }
.tabs { border: 2px solid var(--line); border-bottom-width: 4px; border-radius: 18px; background: var(--surface); }
.tab { border-radius: 13px; font-size: 18px; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .18); }
.frame { border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 32px; box-shadow: none; }
.prog { background: transparent; padding: 24px 36px 4px; }
.seg { height: 14px; border-radius: 7px; background: var(--line); }
.seg.done { background: var(--accent); box-shadow: inset 0 4px 0 rgba(255, 255, 255, .3); }
.seg.now { background: var(--accent); opacity: 1; box-shadow: inset 0 4px 0 rgba(255, 255, 255, .3); }
.prog-l { font-size: 17px; }
h2 { font-size: 36px; line-height: 1.3; }
h3 { font-size: 22px; }
.eyebrow { font-size: 18px; }
.lead { font-size: 22px; }

/* 버튼: 아래가 두툼한 3D 느낌 */
.btn { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; min-height: 46px; padding: 0 24px; font-size: 19px; background: var(--surface); color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent-d); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: transparent; border-bottom-width: 2px; color: var(--muted); }
.btn:disabled, .btn.primary:disabled { opacity: 1; background: var(--line); border-color: color-mix(in srgb, var(--line) 70%, var(--muted)); color: var(--muted); }
.btn:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }

/* 선택 카드류도 같은 두께 */
.opt, .pbtn, .choice, .exc, .tchip { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 20px; }
.opt { padding: 10px 24px; font-size: 21px; min-height: 52px; }
.opt:hover, .pbtn:hover:not(:disabled), .choice:hover:not(:disabled), .exc:hover { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); color: var(--accent-d); }
.pbtn { font-size: 21px; padding: 10px 28px; min-height: 54px; }
.pbtn.right { border-color: var(--good-solid); background: var(--good-bg); color: var(--good); }
.pbtn.wrong { border-color: var(--warn); background: var(--warn-bg); color: var(--warn); }
.exc { font-size: 22px; line-height: 1.4; }
.card { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 28px; box-shadow: none; }
.blank { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 16px; font-size: .88em; }
.blank.filled { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, var(--surface)); color: var(--accent-d); }
.sentence { border-radius: 28px; font-size: 32px; }
.hwc { border-radius: 32px; border-style: solid; border-width: 2px 2px 6px; border-color: var(--line); background: var(--surface-2); }
.sticker { border-radius: 12px; font-size: 17px; }
.tag { font-size: 17px; }
.choice-t { font-size: 42px; }
.hw-t { font-size: 38px; }
.q-big { font-size: 36px; }
.wordmark { font-size: 88px; letter-spacing: 0; color: var(--accent); }
.code-n { font-size: 70px; }
.av { background: linear-gradient(135deg, #22d3ee, var(--accent)); color: #fff; font-size: 17px; }
.bubble { border-radius: 26px 26px 6px 26px; font-family: var(--font); }
.pause { border-radius: 22px; }

/* 위아가 말해주는 안내 */
.coach { display: flex; align-items: flex-end; gap: 14px; }
.cup.cup-s { width: 92px; flex: none; }
.coach-b { position: relative; flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 22px; padding: 16px 22px; font-size: 22px; line-height: 1.5; }
.coach-b::before { content: ""; position: absolute; left: -9px; bottom: 28px; width: 14px; height: 14px; background: var(--surface); border-left: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); }

/* 아래 피드백 시트: 고를 때마다 위아가 반응해요 */
.foot { border-top: 2px solid var(--line); padding: 16px 36px 20px; align-items: center; }
.foot.fbk { border-top-color: transparent; }
.foot.good { background: var(--good-bg); }
.foot.ok { background: var(--warn-bg); }
.foot.weak { background: var(--weak-bg); }
.foot-msg { flex: 1; min-width: 220px; display: flex; align-items: center; gap: 14px; }
.cup.cup-f { width: 58px; flex: none; animation: none; }
.foot-t { font-size: 24px; line-height: 1.2; }
.foot.good .foot-t { color: var(--good); } .foot.ok .foot-t { color: var(--warn); } .foot.weak .foot-t { color: var(--weak); }
.foot-d { font-size: 17px; line-height: 1.5; }

/* AI 답변 안의 요소 */
.blk h4 { margin: 0 0 8px; font-size: 25px; font-weight: 700; line-height: 1.4; }
.blk li .lead { font-weight: 700; }
.blk.closing p { color: var(--muted); }
.cite { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin-left: 4px; border-radius: 11px; background: var(--surface-2); border: 1px solid var(--line); font-size: 12px; font-weight: 700; color: var(--accent-d); vertical-align: 2px; line-height: 1; }
.blk.static { cursor: default; }
.blk.static:hover { background: transparent; }
.streaming .cite:not(:has(.w.on)) { display: none; }

/* 교사 수업 화면: 학생 화면 실시간 미러 + 진행 카드 */
.live-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.mcard { padding: 0; gap: 0; overflow: hidden; position: sticky; top: 12px; }
.m-top { display: flex; align-items: center; gap: 10px; padding: 14px 22px; background: var(--surface-2); border-bottom: 2px solid var(--line); font-size: 16px; flex-wrap: wrap; }
.m-top b { font-family: var(--disp); font-weight: 400; font-size: 19px; }
.m-top .note { margin-left: auto; }
.mirror { pointer-events: none; user-select: none; zoom: .8; }
.mirror, .mirror * { animation: none !important; }
.mirror .prog { padding-top: 18px; }
.m-body { padding: 20px 34px 28px; display: flex; flex-direction: column; gap: 26px; min-height: 600px; min-width: 0; }
.m-body.center { justify-content: center; }
.m-body > * { width: 100%; max-width: 840px; margin-inline: auto; }
.mirror .foot { padding: 14px 28px; border-top-width: 0; }
.gcard { gap: 18px; }
.g-top { display: flex; align-items: center; gap: 14px; }
.g-n { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); border-bottom: 4px solid var(--accent-d); display: grid; place-items: center; font-family: var(--disp); font-size: 22px; }
.g-t { font-family: var(--disp); font-size: 26px; line-height: 1.2; }
.gcard .eyebrow { margin-bottom: 8px; font-size: 15px; }
.gcard .coach-b { font-size: 18px; padding: 12px 18px; }
.gcard .cup.cup-s { width: 56px; }
.g-pts { margin: 0; padding-left: 20px; display: grid; gap: 8px; font-size: 17px; line-height: 1.55; }
.g-pts li::marker { color: var(--accent); }
.g-pts .ans { font-family: var(--disp); color: var(--good); }
.g-act { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; border-top: 2px solid var(--line); padding-top: 16px; }
.g-act .hint { order: -1; flex-basis: 100%; font-size: 14px; color: var(--muted); }
.g-act .hint:empty { display: none; }
details.tl > summary { cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; font-family: var(--disp); font-size: 22px; }
details.tl > summary::-webkit-details-marker { display: none; }
details.tl[open] > summary { margin-bottom: 18px; }

/* ---------- 하늘 컨셉 · 구름 친구 위아 ---------- */
.skyfx { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.sc { position: absolute; left: 0; top: var(--y); width: var(--w); height: calc(var(--w) * .3); background: #fff; opacity: .55; border-radius: 999px; transform: translateX(var(--x)); }
.sc::before, .sc::after { content: ""; position: absolute; background: #fff; border-radius: 50%; }
.sc::before { width: 42%; height: 150%; left: 16%; bottom: 35%; }
.sc::after { width: 32%; height: 120%; right: 18%; bottom: 35%; }
@media not all { :root:not([data-theme="light"]) .sc { opacity: .08; } }
:root[data-theme="wia-off"] .sc { opacity: .08; }
.brand { flex-direction: row; align-items: center; gap: 14px; }
.brand-s { font-size: 14px; color: var(--ink); opacity: .78; }
.logo { width: 104px; height: auto; flex: none; color: var(--logo); overflow: visible; }
.logo text { font-family: var(--disp), sans-serif; }
.hero .logo { width: 280px; }
.draft { color: var(--ink); background: color-mix(in srgb, var(--surface) 55%, transparent); }
.cup .sprout { transform-box: view-box; transform-origin: 101px 31px; }
.cup.cup-s { width: 104px; }
.cup.cup-f { width: 66px; }
.cup.cup-xl { width: 190px; }

/* 말풍선: 글자가 한 글자씩 나와요 (자리는 미리 잡아 두어서 화면이 출렁이지 않아요) */
.coach-b, .w-bubble { --bpx: 22px; --bpy: 16px; color: var(--ink); }
.bub { position: relative; }
.bub .t-full { display: block; visibility: hidden; }
.bub .t-live { position: absolute; left: var(--bpx); right: var(--bpx); top: var(--bpy); }
.w-bubble.bub .t-live { top: 50%; transform: translateY(-50%); }
.bub.typing .t-live::after { content: ""; display: inline-block; width: 3px; height: 1em; margin-left: 3px; background: var(--accent); border-radius: 2px; vertical-align: -3px; }
.stage { position: relative; height: 330px; display: flex; justify-content: center; align-items: flex-end; }
.wander { --amp: 150px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
.w-bubble { --bpx: 20px; --bpy: 14px; position: relative; width: min(340px, 78vw); background: var(--surface); border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 24px; padding: var(--bpy) var(--bpx); font-family: var(--disp); font-size: 21px; line-height: 1.45; text-align: center; }
.w-bubble::after { content: ""; position: absolute; left: 50%; bottom: -10px; width: 14px; height: 14px; margin-left: -7px; background: var(--surface); border-right: 2px solid var(--line); border-bottom: 2px solid var(--line); transform: rotate(45deg); border-bottom-right-radius: 3px; }
@keyframes wander {
  0% { transform: translate(calc(var(--amp) * -1), 0); }
  22% { transform: translate(calc(var(--amp) * -.35), -22px); }
  50% { transform: translate(var(--amp), 4px); }
  76% { transform: translate(calc(var(--amp) * .3), -16px); }
  100% { transform: translate(calc(var(--amp) * -1), 0); }
}
@keyframes hop { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(0) scale(1.06, .94); } 52% { transform: translateY(-20px) scale(.97, 1.04); } 74% { transform: translateY(0) scale(1.05, .95); } }
@keyframes sway { 0%, 100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
@keyframes drift { from { transform: translateX(-30vw); } to { transform: translateX(110vw); } }
@keyframes caret { 50% { opacity: 0; } }
@media (prefers-reduced-motion: no-preference) {
  .wander { animation: wander 11s ease-in-out infinite; }
  .cup.cup-xl { animation: hop 2.4s ease-in-out infinite; transform-origin: 50% 100%; }
  .cup .sprout { animation: sway 2.6s ease-in-out infinite; }
  .sc { animation: drift var(--t) linear var(--dl) infinite; }
  .bub.typing .t-live::after { animation: caret .8s steps(1) infinite; }
}
.mirror .wander, .mirror .cup, .mirror .sprout { animation: none !important; }

@media (max-width: 760px) {
  .wander { --amp: 28px; }
  .stage { height: 250px; }
  .logo { width: 72px; }
  .hero .logo { width: 220px; }
  .brand-s { font-size: 12px; }
  .coach-b { --bpx: 16px; --bpy: 12px; }
  .live-grid { grid-template-columns: minmax(0, 1fr); }
  .card.mcard { position: static; padding: 0; }
  .mirror { zoom: .72; }
  .m-body { padding: 16px 18px 22px; min-height: 0; }
  .s-grid { grid-template-columns: minmax(0, 1fr); }
  .cup.cup-s { width: 62px; }
  .coach-b { font-size: 18px; padding: 12px 16px; }
  .foot { padding: 12px 18px 18px; }
  .foot-msg .cup-f { display: none; }
  h2, .q-big { font-size: 27px; }
  .wordmark { font-size: 64px; }

/* motion: 기본 상태는 모두 보이고, 움직임은 선호 설정이 허용할 때만 */
@keyframes up { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes pop { 0% { transform: scale(.82); } 55% { transform: scale(1.1); } 100% { transform: scale(1); } }
@keyframes slide { from { opacity: 0; transform: translateX(-10px); } to { opacity: 1; transform: none; } }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
@keyframes blink { 0%, 90%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
@keyframes dot { 0%, 80%, 100% { transform: translateY(0); opacity: .35; } 40% { transform: translateY(-7px); opacity: 1; } }
@keyframes ring { from { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); } to { box-shadow: 0 0 0 14px transparent; } }
@keyframes nudge { 0%, 100% { transform: none; } 30% { transform: translateX(-4px); } 60% { transform: translateX(4px); } }
@keyframes wi { from { opacity: 0; } to { opacity: 1; } }
@keyframes now { 0%, 100% { opacity: .35; } 50% { opacity: .85; } }
@media (prefers-reduced-motion: no-preference) {
  .enter > * { animation: up .45s both; }
  .enter > *:nth-child(2) { animation-delay: .07s; }
  .enter > *:nth-child(3) { animation-delay: .14s; }
  .enter > *:nth-child(4) { animation-delay: .21s; }
  .enter > *:nth-child(5) { animation-delay: .28s; }
  .enter > *:nth-child(6) { animation-delay: .35s; }
  .opt, .pbtn, .blank, .btn, .blk, .seg-tabs button { transition: border-color .15s, background-color .15s, transform .12s; }
  .btn:active:not(:disabled), .opt:active, .pbtn:active, .blank:active { transform: scale(.97); }
  .seg.now { animation: now 1.6s ease-in-out infinite; }
  .blank.pop { animation: pop .38s; }
  .fb.slide { animation: slide .3s; }
  .tag.pp { animation: pop .5s var(--d) both; }
  .sticker { animation: pop .6s .1s both; }
  .cup { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
  .eye { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
  .dots i { animation: dot 1.1s infinite; }
  .dots i:nth-child(2) { animation-delay: .15s; }
  .dots i:nth-child(3) { animation-delay: .3s; }
  .bubble, .typing, .av { animation: up .4s both; }
  .rv-a { animation: up .5s var(--d) both; }
  .w.on { animation: wi .25s both; }
  .seg-p.hl { animation: ring .9s; }
  .prov.pop { animation: slide .3s; }
  .pbtn.wrong { animation: nudge .35s; }
  .pbtn.right { animation: pop .3s; }
  .done-box { animation: pop .5s; }
  .hint-pulse { animation: now 1.8s ease-in-out infinite; }
  .opt.sel { transform: scale(1.03); }
  .opt.sel.pop, .opt.sel:focus-visible { animation: pop .32s; }
}

/* ================= 가로 태블릿 (iPad 가로 1024~1366px 기준) ================= */
.cols { display: flex; flex-direction: column; gap: 26px; width: 100%; max-width: 840px; margin-inline: auto; flex: 1 0 auto; }
.col-l, .col-r { display: contents; }
.cols.mid { justify-content: center; }
.cup.cup-m { width: 92px; flex: none; }
.prov-wrap { display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }
.mscale { position: relative; overflow: hidden; background: var(--surface); }
.mirror { position: absolute; left: 0; top: 0; width: 1120px; min-height: 700px; display: flex; flex-direction: column; transform-origin: 0 0; zoom: 1; background: var(--surface); }
.mirror .body { flex: 1; }
.mirror .prog { padding-top: 22px; }
.live-grid { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.mcard { overflow: hidden; }

@media (min-width: 860px) and (min-height: 520px) {
  .wrap { max-width: 1280px; gap: 12px; }
  body { padding-block: 10px 14px; padding-inline: 14px; }
  .brand-s { font-size: 13px; line-height: 1.35; }

.cup { display: block; height: auto; flex: none; }
.cup.cup-xl { width: 230px; } .cup.cup-s { width: 120px; } .cup.cup-m { width: 130px; } .cup.cup-f { width: 62px; }
.logo { width: 520px; max-width: 100%; margin-inline: auto; animation: none !important; }
.hero .logo { width: 400px; }
:root { --plate: transparent; }
@media not all { :root:not([data-theme="light"]) { --plate: #f7faff; } }
:root[data-theme="wia-off"] { --plate: #f7faff; }
.hero .logo { background-color: var(--plate); border-radius: 24px; padding: 16px 22px; box-sizing: content-box; }
/* 캐릭터는 둥실둥실, 배경 구름은 천천히 흘러가요 (동작 줄이기 설정이면 멈춤) */

/* ---------- 말풍선 글자 · 캐릭터 말하기 · 자료 화면 ---------- */
@keyframes bch { 0% { opacity: 0; transform: translateY(10px) scale(.5); } 60% { opacity: 1; transform: translateY(-5px) scale(1.18); } 100% { transform: none; } }
@keyframes cupTalk { 0%, 100% { transform: translateY(0) scale(1, 1); } 30% { transform: translateY(-6px) scale(.97, 1.03); } 60% { transform: translateY(0) scale(1.04, .96); } }
.bub .t-live .bw { display: inline-block; white-space: nowrap; }
.bub .t-live .bch { display: inline-block; }
@media (prefers-reduced-motion: no-preference) {
  .bub .t-live .bch { animation: bch .38s cubic-bezier(.3, 1.8, .5, 1) both; }
  .cup.cup-talk { animation: cupTalk .55s ease-in-out infinite !important; }
  .ws-cup { animation: bob 3.2s ease-in-out infinite; }
}
.ws-wrap { display: flex; gap: 28px; align-items: flex-start; width: 100%; max-width: 980px; margin-inline: auto; }
.ws-cup { width: 130px; flex: none; }
.ws-card { flex: 1; min-width: 0; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 28px; padding: 30px 36px; display: flex; flex-direction: column; gap: 18px; }
.ws-card h2 { margin: 0; }
.ws-list, .ws-opts { margin: 0; padding-left: 28px; display: grid; gap: 10px; font-size: 22px; line-height: 1.55; }
.ws-key { align-self: flex-start; background: var(--mark); color: var(--mark-ink); border-radius: 16px; padding: 12px 20px; font-family: var(--disp); font-size: 22px; }
.ws-q { margin: 0; font-size: 24px; font-weight: 600; }
@media (max-width: 760px) { .ws-wrap { flex-direction: column; align-items: center; } .ws-cup { width: 96px; } }

/* ---------- 인트로 화면 ---------- */
#intro { position: fixed; inset: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: clamp(14px, 3.2vh, 30px); padding: 24px 20px; text-align: center;
  background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bot) 100%); transition: opacity .28s ease; }
#intro[hidden] { display: none; }
#intro.out { opacity: 0; pointer-events: none; }
#intro .logo { width: min(600px, 74vw); max-width: none; background-color: var(--plate); border-radius: 28px; padding: 18px 28px; box-sizing: content-box; }
#intro .crew { display: flex; align-items: flex-end; justify-content: center; gap: clamp(8px, 2.4vw, 34px); }
#intro .cup { width: clamp(110px, 17vw, 190px); }
#intro .cup.m-basic { width: clamp(140px, 22vw, 250px); }
#intro .intro-sub { font-family: var(--disp), sans-serif; font-size: clamp(18px, 2.4vw, 24px); color: var(--ink); margin: 0; }
#intro .btn { font-size: 22px; padding: 16px 52px; }
@media (max-height: 640px) { #intro .logo { width: min(420px, 60vw); } #intro .cup { width: 104px; } #intro .cup.m-basic { width: 130px; } }

/* ---------- 복제본 추가: 입장 화면(학생 코드 / 선생님 로그인) + 선생님 화면 ---------- */
#intro .entry { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
#intro .entry .btn { min-width: 220px; }
#intro.form-open .crew, #intro.form-open .intro-sub { display: none; }
#intro.form-open .logo { width: min(360px, 60vw); }
.entry-form { display: flex; flex-direction: column; gap: 12px; width: min(440px, 100%); background: var(--surface); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 28px; padding: 28px 28px 22px; text-align: left; }
.entry-form h2 { font-family: var(--disp); font-weight: 400; font-size: 28px; text-align: center; }
.entry-hint { margin: -6px 0 4px; text-align: center; color: var(--muted); font-size: 17px; }
.entry-l { font-size: 15px; font-weight: 700; color: var(--muted); margin-bottom: -6px; }
.entry-form .input { font-size: 20px; min-height: 56px; }

<script>
/* ---------- 복제본 추가: 학생이 코드로 들어온 수업을 학생 화면 시나리오로 바꿔 줌 ----------
   선생님이 연 수업(클래스)의 내용을 학생 시안의 시나리오 모양(SCEN.s1과 같은 칸)으로 옮겨서 그대로 씀. */
(function () {
  var ss = null;
  try { ss = JSON.parse(sessionStorage.getItem('wia-student') || 'null'); } catch (e) {}
  window.WIA_STUDENT = ss;
  window.WIA_CODE = ss ? ss.code : '';
/* 수업 흐름: 활동 7단계(숫자 0~6)와 자료 화면 블럭('pg:<장 id>')의 순서 */
var wiaFlow = function (l) {
  var D = [0, 1, 2, 3, 4, 5, 6], ids = {};
  ((l && l.pages) || []).forEach(function (p) { if (p && p.id) ids[p.id] = 1; });
  var o = (l && Array.isArray(l.order)) ? l.order : D, seen = {};
  o = o.filter(function (t) {
    var ok = typeof t === 'number' ? (t >= 0 && t <= 6) : (typeof t === 'string' && t.indexOf('pg:') === 0 && ids[t.slice(3)]);
    if (!ok || seen[String(t)]) return false; seen[String(t)] = 1; return true;
  });
  var pages = o.filter(function (t) { return typeof t === 'string'; });
  for (var i = 0; i <= 6; i++) if (o.indexOf(i) < 0) return D.concat(pages);
  if (wiaFlowProblem(o)) return D.concat(pages);
  return o;
}
var wiaFlowProblem = function(o) {
  if (o[0] !== 0) return '‘입장’은 항상 맨 앞이에요.';
  if (o.indexOf(4) < o.indexOf(3) || o.indexOf(4) < o.indexOf(2)) return '‘새 답변 비교’는 ‘일단 보내보기’와 ‘말 고쳐 쓰기’ 뒤에 와야 해요.';
  return '';
}

  window.WIA_FLOW = wiaFlow(ss && ss.lesson);
  window.WIA_POSOF = function (t) { var i = window.WIA_FLOW.indexOf(t); return i < 0 ? (typeof t === 'number' ? t : 0) : i; };
  window.WIA_STEP_AFTER = function (st, d) {
    var F = window.WIA_FLOW, i = F.indexOf(st);
    for (var j = i + d; j >= 0 && j < F.length; j += d) if (typeof F[j] === 'number') return F[j];
    return st;
  };
  /* 자료 화면 블럭: 선생님이 넘기면 학생 화면에 크게 보여 줌 */
  window.WIA_SLIDE = function (tok) {
    var host = document.getElementById('view-student'); if (!host) return;
    var frame = host.querySelector('.frame:not(#wia-slide)'), box = document.getElementById('wia-slide');
    if (!tok) { if (box) box.remove(); if (frame) frame.hidden = false; return; }
    var P = (ss && ss.lesson && ss.lesson.pages) || [], id = String(tok).slice(3), p = null;
    for (var i = 0; i < P.length; i++) if (P[i].id === id) p = P[i];
    if (!p) return;
    var F = window.WIA_FLOW, pos = F.indexOf(tok), segs = '';
    for (var k = 0; k < F.length; k++) segs += '<div class="seg ' + (k < pos ? 'done' : k === pos ? 'now' : '') + '"></div>';
    var lines = String(p.body || '').split('\n').filter(function (x) { return x.trim(); }).map(function (x) { return x.replace(/^\s*(\d+\.|[-•·])\s*/, ''); });
    var body = p.kind === 'check'
      ? '<p class="ws-q">' + esc(p.q) + '</p><ol class="ws-opts">' + (p.opts || []).map(function (o) { return '<li>' + esc(o) + '</li>'; }).join('') + '</ol>'
      : (lines.length ? '<ul class="ws-list">' + lines.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + (p.key ? '<div class="ws-key">' + esc(p.key) + '</div>' : '');
    var html = '<div class="prog"><div class="segs">' + segs + '</div><div class="prog-l">' + (pos + 1) + ' / ' + F.length + ' · 자료</div></div>' +
      '<div class="body enter"><div class="ws-wrap"><i class="cup m-wink ws-cup" role="img" aria-label="위아"></i><div class="ws-card"><h2>' + esc(p.title || '') + '</h2>' + body + '</div></div></div>';
    if (!box) { box = document.createElement('div'); box.id = 'wia-slide'; box.className = 'frame'; host.appendChild(box); }
    box.innerHTML = html;
    if (frame) frame.hidden = true;
  };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function same(a, b) { return a.every(function (v, i) { return v === b[i]; }); }

  /* 빈칸 문장: [빈칸1] → {0}, 가장 긴 고정 문구는 [[ ]]로 감싸 답변과 연결되게 함 */
  function convTpl(t) {
    var parts = String(t).split(/(\[빈칸[123]\])/), best = -1, len = 0;
    parts.forEach(function (p, i) { if (!/^\[빈칸/.test(p) && p.trim().length > len) { len = p.trim().length; best = i; } });
    return parts.map(function (p, i) {
      var m = p.match(/^\[빈칸([123])\]$/); if (m) return '{' + (m[1] - 1) + '}';
      if (i === best) { var lead = p.match(/^[\s,.]*/)[0], tail = p.match(/[\s]*$/)[0]; return lead + '[[' + p.slice(lead.length, p.length - tail.length) + ']]' + tail; }
      return p;
    }).join('');
  }

  /* 답변 글 → 블록 (첫 줄=나 알려주기, 번호 목록=개수·범위, 나머지=확인 단서) */
  function linesToBlocks(text, p, slots, qt) {
    var lines = String(text || '').split('\n').filter(function (x) { return x.trim(); }), out = [], list = [], rest = [];
    var why = function (si) { var o = slots[si][p[si]]; return qt(si, p[si]) + '라고 해서: ' + o.fb; };
    lines.forEach(function (ln, i) {
      var m = ln.match(/^\s*\d+\.\s*(.*)$/);
      if (m) list.push(m[1]); else if (i === 0) out.push({ html: '<p>' + esc(ln) + '</p>', keys: ['a'], why: why(0) }); else rest.push(ln);
    });
    if (list.length) out.push({ html: '<ol>' + list.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ol>', keys: ['base', 'b'], why: why(1) });
    rest.forEach(function (ln) { out.push({ html: '<p>' + esc(ln) + '</p>', keys: ['c'], why: why(2) }); });
    return out;
  }

  /* 동화 캐릭터 예시 클래스: 고른 말마다 답이 달라지게 (시안용 예시) */
  var FAV5 = [['Hong Gildong', '홍길동', '「홍길동전」', 'courage', '용감한'], ['Robin Hood', '로빈 후드', '프랑스 동화 「로빈 후드」', 'generous', '너그러운'], ['Peter Pan', '피터 팬', '「피터 팬」', 'adventurous', '모험을 좋아하는'], ['Kongjwi', '콩쥐', '「콩쥐팥쥐」', 'kind', '착한'], ['Nolbu', '놀부', '「흥부와 놀부」', 'greedy', '욕심 많은']];
  var MIX5 = [['Hong Gildong', '홍길동', '「홍길동전」', 'brave', '용감한'], ['Elsa', '엘사', '영화 「겨울왕국」', 'strong', '강한'], ['Peter Pan', '피터 팬', '「피터 팬」', 'adventurous', '모험을 좋아하는'], ['Iron Man', '아이언맨', '영화 「아이언맨」', 'smart', '똑똑한'], ['Kongjwi', '콩쥐', '「콩쥐팥쥐」', 'kind', '착한']];
  var MANY = '신데렐라, 백설공주, 피터 팬, 피노키오, 엘사, 해리 포터, 손오공, 아이언맨, 흥부, 놀부, 콩쥐, 팥쥐, 로빈 후드, 앨리스, 심청, 라푼젤, 미키 마우스, 슈렉, 인어공주, 헨젤과 그레텔';
  function answerFav(L, slots, qt, p) {
    var q = p.map(function (v, i) { return slots[i][v].q; });
    if (same(p, L.first) || (q[0] === 'good' && q[1] === 'good' && q[2] === 'good')) return linesToBlocks(same(p, L.first) ? L.firstAnswer : L.newAnswer, p, slots, qt);
    var out = [], why = function (si) { return qt(si, p[si]) + '라고 해서: ' + slots[si][p[si]].fb; };
    var intro = { good: '중3 영어 설문용으로, 반 친구들이 잘 알 만한 동화 속 캐릭터예요.', weak: '동화 속 캐릭터를 추천해 드릴게요!', ok: '동화 전문가로서 세계 명작 동화의 대표 캐릭터를 소개합니다.' }[q[0]];
    out.push({ html: '<p>' + esc(intro) + '</p>', keys: ['a'], why: why(0) });
    if (q[1] === 'weak') {
      out.push({ html: '<p>' + esc(MANY) + '……</p>', keys: ['base', 'b'], why: why(1) });
    } else {
      var set = q[1] === 'good' ? FAV5 : MIX5;
      out.push({ html: '<ol>' + set.map(function (c) {
        return '<li><b class="lead">' + esc(c[0]) + '(' + esc(c[1]) + ')</b>' + (q[2] === 'good' ? ' · ' + esc(c[2]) + ' · ' + esc(c[3]) + '(' + esc(c[4]) + ')' : q[2] === 'ok' ? ' · 진짜 인기 많아요!' : '') + '</li>';
      }).join('') + '</ol>', keys: ['base', 'b'], why: why(1) });
    }
    if (q[2] === 'weak') out.push({ html: '<p><b>설문 결과 글도 써 드릴게요.</b> Many students picked Hong Gildong because he is courage. No one picked Nolbu. I think it’s because he is too greedy. My favorite character is Peter Pan because he is adventurous.</p>', keys: ['c'], why: why(2) });
    else if (q[2] === 'ok') out.push({ html: '<p>재미있는 설문 되세요~! 다들 좋아할 거예요!</p>', keys: ['c'], why: why(2) });
    else out.push({ html: '<p>작품 이름과 단어 뜻은 한 번 더 확인해 보세요.</p>', keys: ['c'], cls: 'closing', why: why(2) });
    return out;
  }

  function buildSC(L) {
    var hw = esc(L.hw), mk = esc(L.hwMark || '');
    if (mk && hw.indexOf(mk) > -1) hw = hw.replace(mk, '<span class="hl-mark">' + mk + '</span>');
    var slots = L.slots.map(function (s) { return s.opts.map(function (o) { return { text: o.text, q: o.q, fb: o.fb }; }); });
    var qt = function (si, i) { return '“' + slots[si][i].text + '”'; };
    return {
      id: L.id, type: 'A', grade: L.grade, subject: L.subject, topic: L.title,
      tags: [['pink', L.subject], ['mint', L.kind]].concat(L.due ? [['lemon', L.due]] : []),
      hw: hw, hwGray: L.steps[1].coach,
      head3: esc(L.steps[2].head), coach3: L.steps[2].coach, firstNote: esc(L.firstNote),
      head4: esc(L.steps[3].head), coach4: L.steps[3].coach,
      tpl: convTpl(L.tpl), slots: slots, first: L.first.slice(), take: L.take.slice(),
      cards: L.cards.map(function (c) { return { label: c.label, pre: c.pre, tgt: c.tgt, post: c.post, q: '이 말, 어떤 것 같아요?', right: c.right, why: c.why }; }),
      choices: [['ok', '맞는 것 같아요'], ['sus', '좀 수상해요']],
      notes: { first: L.steps[2].say, compare: L.steps[4].say },
      q7: L.q7, done: L.done,
      answer: function (p) { return L.tplId === 'fav' ? answerFav(L, slots, qt, p) : linesToBlocks(same(p, L.first) ? L.firstAnswer : L.newAnswer, p, slots, qt); }
    };
  }
  /* 선생님 화면: 반이 가장 많이 고른 말로 보낸 AI 답 */
  window.WIA_ANSWER_BLOCKS = function (L, p) {
    var slots = L.slots.map(function (sl) { return sl.opts.map(function (o) { return { text: o.text, q: o.q, fb: o.fb }; }); });
    var qt = function (si, i) { return '“' + slots[si][i].text + '”'; };
    try { return L.tplId === 'fav' ? answerFav(L, slots, qt, p) : linesToBlocks(same(p, L.first) ? L.firstAnswer : L.newAnswer, p, slots, qt); } catch (e) { return null; }
  };

  /* ---------- 학생 화면 동기화: 선생님이 넘긴 단계로 따라가고, 고른 답을 선생님에게 보냄 ---------- */
  window.WIA_SYNC_HOOK = function (ctx) {
    if (!ss || !ss.sid) return;
    var S = ctx.S, note = document.getElementById('sync-note'), lastStep = null, state = '', flashT = null, lastRec = '';
    try {
      var mr = JSON.parse(WIA_STORE.getItem('wia-stu:' + ss.sid) || 'null'), got = false;
      if (mr && mr.epoch === ss.epoch) {
        if (mr.nick) { S.nick = mr.nick; got = true; }
        if (Array.isArray(mr.picks) && S.pick) mr.picks.forEach(function (v, i) { if (i < S.pick.length && v !== null && v !== undefined) { S.pick[i] = v; got = true; } });
        if (Array.isArray(mr.rp) && S.rpick) mr.rp.forEach(function (v, i) { if (i < S.rpick.length && v) { S.rpick[i] = v; got = true; } });
        if (mr.ans) { S.answer = mr.ans; got = true; }
        if (mr.fin) S.finished = true;
        if (got && ctx.render) ctx.render();
      }
    } catch (e) {}
    function live() { try { return JSON.parse(WIA_STORE.getItem('wia-live') || 'null'); } catch (e) { return null; } }
    function mine(lv) { return lv && lv.code === ss.code && lv.epoch === ss.epoch; }
    function setNote(t) { note.textContent = t; note.hidden = !t; }
    function stateNote() {
      return state === 'open' ? '닉네임을 정하고 기다려 주세요. 선생님이 수업을 시작하면 함께 시작해요.'
        : state === 'ended' ? '수업이 끝났어요. 지금부터는 자유롭게 다시 볼 수 있어요.' : '';
    }
    function flash(t) { clearTimeout(flashT); setNote(t); flashT = setTimeout(function () { setNote(stateNote()); }, 2600); }
    function apply() {
      setTimeout(tidyFoot, 0);
      var lv = live();
      if (!mine(lv) || lv.status === 'ended') { if (state !== 'ended') { state = 'ended'; setNote(stateNote()); window.WIA_SLIDE(null); } return; }
      if (lv.status === 'open') { if (state !== 'open') { state = 'open'; setNote(stateNote()); } return; }
      if (state !== 'running') { state = 'running'; setNote(''); }
      if (lv.step !== lastStep) {
        lastStep = lv.step;
        if (typeof lv.step === 'string') { window.WIA_SLIDE(lv.step); return; }
        window.WIA_SLIDE(null);
        if (S.step !== lv.step) {
          if (window.WIA_POSOF(lv.step) >= window.WIA_POSOF(4)) for (var i = 0; i < S.pick.length; i++) if (S.pick[i] === null) S.pick[i] = lv.maj && lv.maj[i] != null ? lv.maj[i] : 0;
          ctx.go(lv.step);
        }
      }
    }
    function report() {
