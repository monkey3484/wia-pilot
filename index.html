/* ---------- 편집기: 헤더 아래 전체 폭 ---------- */
.ed { display: flex; flex-direction: column; min-height: calc(100vh - 60px); }
.ed-bar { display: flex; align-items: center; gap: 16px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.ed-bar .tt { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; }
.ed-bar .tt input { border: 1px solid transparent; background: none; font-size: 18px; font-weight: 700; padding: 2px 8px; margin-left: -9px; border-radius: 6px; width: 100%; }
.ed-bar .tt input:hover { border-color: var(--line); }
.ed-bar .tt input:focus { outline: none; border-color: var(--accent); }
.ed-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 400px; min-height: 0; }
.stage { padding: 20px 28px 32px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.stp { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stp small { font-size: 11px; color: var(--muted); font-weight: 600; }
.stp b { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stp:hover { border-color: var(--accent); }
.stp[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-d); box-shadow: inset 0 -2px 0 var(--accent); }
.stp[aria-current="true"] small { color: var(--accent-d); }
.stage-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.pv-box { width: 100%; position: relative; overflow: hidden; border-radius: 20px; box-shadow: 0 4px 24px rgba(29, 36, 71, .06); }
.side-panel { border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }
.sp-h { padding: 18px 22px 14px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.sp-h b { font-size: 16px; }
.sp-b { padding: 18px 22px 28px; display: flex; flex-direction: column; gap: 16px; overflow-y: auto; }
.grp { display: flex; flex-direction: column; gap: 14px; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.grp:last-child { border-bottom: 0; padding-bottom: 0; }
.grp-t { font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }
.slot { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.slot-h { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--hover); font-size: 13px; font-weight: 700; }
.slot-h .inp { height: 30px; font-size: 13px; max-width: 170px; margin-left: auto; }
.opt { display: grid; grid-template-columns: 22px minmax(0, 1fr) 96px; gap: 8px; align-items: center; padding: 8px 10px; border-top: 1px solid var(--line); }
.opt .inp, .opt .sel { height: 32px; font-size: 13px; padding: 0 8px; }
.opt .fbk { grid-column: 2 / -1; }
.opt input[type="radio"] { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.ccard { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.ccard .slot-h .sel { height: 30px; font-size: 13px; max-width: 150px; margin-left: auto; }
.mini { display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 10px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
.mini .inp { height: 32px; font-size: 13px; padding: 0 8px; }
.sp-f { padding: 14px 22px; border-top: 1px solid var(--line); display: flex; justify-content: flex-end; }
.sp-f .btn { min-width: 140px; }
.redo { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--hover); border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--muted); }
.firstline { background: var(--hover); border-radius: 8px; padding: 10px 12px; font-size: 13px; }

/* ---------- 팝업 ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 60; display: grid; place-items: center; padding: 16px; }
.modal { width: min(460px, 100%); background: var(--surface); border-radius: 14px; padding: 24px; display: flex; flex-direction: column; gap: 18px; box-shadow: 0 20px 60px rgba(0,0,0,.2); }
.modal-f { display: flex; justify-content: flex-end; gap: 8px; }

/* ---------- 수업 진행 (프로젝터용) ---------- */
.lv { display: flex; flex-direction: column; min-height: calc(100vh - 60px); }
.lv-bar { display: flex; align-items: center; gap: 20px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.lv-bar .tt { flex: 1 1 280px; min-width: 0; }
.lv-bar .tt b { display: block; font-size: 17px; }
.lv-steps { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; padding: 14px 24px 0; }
.ls { border: 0; background: none; padding: 0; display: flex; flex-direction: column; gap: 6px; text-align: left; min-width: 0; }
.ls i { height: 6px; border-radius: 3px; background: var(--line); }
.ls.on i, .ls.now i { background: var(--accent); }
.ls span { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ls.now span { color: var(--ink); font-weight: 700; }
.lv-body { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 24px; padding: 20px 24px 28px; align-items: start; }
.lv-side { display: flex; flex-direction: column; gap: 16px; }
.lv-card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; }
.bigcode { display: flex; gap: 16px; align-items: center; }
.bigcode b { font-size: 48px; font-weight: 700; letter-spacing: .1em; line-height: 1; font-variant-numeric: tabular-nums; }
.qr { width: 84px; height: 84px; border-radius: 8px; border: 1px dashed var(--line); display: grid; place-items: center; font-size: 11px; color: var(--muted); flex: none; text-align: center; line-height: 1.3; }
.say { font-size: 15px; line-height: 1.7; color: var(--ink-2); }
.lv-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }

/* ---------- 구조도 ---------- */
.flow { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.fbox { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px; }
.fbox:hover { border-color: var(--accent); }
.fbox small { font-size: 12px; font-weight: 700; color: var(--accent-d); }
.fbox b { font-size: 16px; }
.fbox span { font-size: 13px; color: var(--muted); }
.tbl-wrap { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 14px; min-width: 640px; }
table.t th, table.t td { border-bottom: 1px solid var(--line); padding: 10px 20px; text-align: left; vertical-align: top; }
table.t th { font-size: 12px; color: var(--muted); font-weight: 600; background: var(--hover); }
.q-list { margin: 0; padding: 4px 20px 18px 40px; display: grid; gap: 8px; font-size: 14px; }


/* ---------- 학습 현황 (수업 시작 후) ---------- */
.lv-main { padding: 24px 24px 64px; }
.wrap.wide { max-width: 1240px; }
.lv-top { display: grid; grid-template-columns: 1.5fr 1fr 1fr 1fr; gap: 16px; }
.lv-top .lv-card { gap: 8px; }
.code-card .bigcode b { font-size: 42px; }
.bigcode b.off { color: var(--muted); text-decoration: line-through; text-decoration-thickness: 2px; }
.stat b { font-size: 30px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat b small { font-size: 14px; font-weight: 500; color: var(--muted); }
.stat b.state { font-size: 22px; }
.stat b.state.live { color: var(--good); }
.stat b.state.done { color: var(--muted); }
.tabs-note { margin-left: auto; align-self: center; }
.sttbl td { vertical-align: middle; padding-top: 12px; padding-bottom: 12px; }
.sttbl th { white-space: nowrap; }
.sttbl .btn { height: 32px; padding: 0 12px; font-size: 13px; }
.sttbl td.num { color: var(--muted); font-variant-numeric: tabular-nums; width: 56px; }
.sttbl td:last-child { text-align: right; }
.ans-cell { max-width: 320px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-2); }
.pcell { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.prog7 { display: inline-flex; gap: 3px; }
.prog7 i { width: 14px; height: 8px; border-radius: 2px; background: var(--line); }
.prog7 i.on { background: var(--accent); }
.prog7 i.now { background: color-mix(in srgb, var(--accent) 40%, var(--line)); }
.prog7.fin i { background: var(--good-solid); }
.qd { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin-right: 5px; vertical-align: -1px; }
.qd.good { background: var(--good-solid); }
.qd.ok { background: #f0a43a; }
.qd.weak { background: #e05555; }
.where { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
.where div { padding: 16px 12px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.where div:last-child { border-right: 0; }
.where b { font-size: 26px; font-variant-numeric: tabular-nums; }
.where span { font-size: 12px; color: var(--muted); }
.where .fin b { color: var(--good); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.box.pad { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; overflow: visible; }
.sl { display: flex; flex-direction: column; gap: 6px; }
.sl-h { font-size: 13px; font-weight: 700; color: var(--ink-2); margin-top: 4px; }
.obar { display: grid; grid-template-columns: minmax(0, 1fr) 120px 48px; gap: 10px; align-items: center; font-size: 13px; }
.obar .ot { min-width: 0; }
.obar .track { display: block; height: 8px; border-radius: 4px; background: var(--hover); overflow: hidden; }
.obar .track em { display: block; height: 100%; border-radius: 4px; }
.obar .track em.good { background: var(--good-solid); }
.obar .track em.ok { background: #f0a43a; }
.obar .track em.weak { background: #e05555; }
.obar .ov { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
.say-box { background: var(--hover); border-radius: 10px; padding: 12px 14px; font-size: 14px; line-height: 1.65; display: flex; flex-direction: column; gap: 4px; }
.say-box b { font-size: 12px; color: var(--muted); }
.q7 { padding: 12px 20px; font-size: 14px; color: var(--ink-2); background: var(--hover); border-bottom: 1px solid var(--line); }
.answers { list-style: none; margin: 0; padding: 0; }
.answers li { display: grid; grid-template-columns: 100px minmax(0, 1fr); gap: 16px; padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 14px; }
.answers li:last-child { border-bottom: 0; }
.scr-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 20px; align-items: start; }
.stage-l { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.scr-side { position: sticky; top: 76px; }
.livedot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--good-solid); margin-right: 6px; vertical-align: 1px; }
.modal.wide { width: min(680px, 100%); max-height: calc(100vh - 48px); overflow-y: auto; gap: 0; padding: 0; }
.mh { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 20px 24px 16px; border-bottom: 1px solid var(--line); }
.mh h2 { margin-bottom: 6px; }
.msec { padding: 16px 24px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; }
.msec:last-child { border-bottom: 0; }
.sent-t { font-size: 15px; line-height: 1.9; background: var(--hover); border-radius: 10px; padding: 12px 14px; }
.pk { padding: 1px 6px; border-radius: 5px; font-weight: 600; }
.pk.good { background: var(--good-bg); color: var(--good); }
.pk.ok { background: var(--warn-bg); color: var(--warn); }
.pk.weak { background: var(--weak-bg); color: var(--weak); }
.pk-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; font-size: 14px; }
.pk-list b { margin-right: 4px; }
.mark { display: inline-block; font-size: 11px; font-weight: 700; padding: 0 7px; border-radius: 4px; margin-right: 8px; }
.mark.o { background: var(--good-bg); color: var(--good); }
.mark.x { background: var(--weak-bg); color: var(--weak); }
.q7s { font-size: 13px; color: var(--muted); }
.ans-full { font-size: 15px; line-height: 1.7; border-left: 3px solid var(--accent); padding-left: 12px; }
@media (max-width: 1100px) { .lv-top { grid-template-columns: 1fr 1fr; } .two, .scr-wrap { grid-template-columns: minmax(0, 1fr); } .scr-side { position: static; } }
@media (max-width: 860px) { .lv-top { grid-template-columns: minmax(0, 1fr); } .where { grid-template-columns: repeat(4, minmax(0, 1fr)); } .where div { border-bottom: 1px solid var(--line); } .lv-main { padding: 20px 16px 48px; } .answers li { grid-template-columns: minmax(0, 1fr); gap: 2px; } .obar { grid-template-columns: minmax(0, 1fr) 70px 40px; } }


/* ---------- 클래스 입장(대기실) · 수업 중(동기화) ---------- */
.lobby { flex: 1; display: grid; place-items: center; padding: 40px 24px; }
.lobby-card { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 36px 40px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
.lobby-code { font-size: 72px; font-weight: 700; letter-spacing: .12em; line-height: 1; font-variant-numeric: tabular-nums; }
.lobby-n { font-size: 18px; color: var(--ink-2); }
.lobby-n b { font-size: 34px; color: var(--accent-d); margin-right: 4px; font-variant-numeric: tabular-nums; }
.nicks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-height: 160px; overflow-y: auto; }
.nicks span { font-size: 13px; background: var(--hover); border: 1px solid var(--line); border-radius: 999px; padding: 2px 12px; }
.nicks .none { background: none; border: 0; color: var(--muted); }
.go-btn { min-width: 220px; margin-top: 6px; }
.sync-bar { display: flex; align-items: center; gap: 20px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.sync-bar .lv-steps { flex: 1 1 420px; padding: 0; }
.sync-ctl { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.sync-ctl .meta { margin-right: 6px; }
.ansn { font-size: 13px; color: var(--warn); background: var(--warn-bg); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.ansn b { font-size: 15px; }
.ansn.all { color: var(--good); background: var(--good-bg); }
.sync-stage { padding: 16px 24px 24px; }
.sf.sync .sf-body { grid-template-columns: 30% 70%; }
.sf.nofoot .sf-foot { display: none; }
.sf.sync .sf-left .cup { width: 150px; }
.sf.sync .sf-left h2 { font-size: 32px; }
.sf.sync .sf-right { justify-content: flex-start; padding-top: 16px; overflow-y: auto; }
.pct { display: inline-block; margin-left: 10px; font-family: var(--font); font-size: 14px; font-weight: 700; line-height: 1.5; padding: 0 7px; border-radius: 6px; background: var(--surface); border: 1px solid var(--line-2); color: var(--ink-2); vertical-align: 2px; }
.s-opt.sel .pct, .pbtn.right .pct { border-color: currentColor; color: inherit; }
.sgrp { display: flex; flex-direction: column; gap: 8px; }
.sgrp-l { font-size: 15px; font-weight: 700; color: var(--muted); }
.sf.sync .sent { font-size: 23px; padding: 16px 22px; }
.sf.sync .s-opt { font-size: 18px; min-height: 46px; padding: 6px 16px; }
.sf.sync .ans .ab ol { margin: 0; padding-left: 24px; }
.sf.sync .ans .ab p { margin: 0; }
.alist { border: 2px solid var(--line-2); border-radius: 20px; background: var(--surface); max-height: 420px; overflow-y: auto; }
.alist div { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 14px; padding: 10px 18px; border-bottom: 1px solid var(--line-2); font-size: 18px; }
.alist div:last-child { border-bottom: 0; }
.alist .s-due { padding: 18px; }

/* 결과 보기 애니메이션 */
.sync-stage { position: relative; }
.reveal-btn { position: absolute; left: 50%; bottom: 56px; transform: translateX(-50%); height: 64px; padding: 0 56px; font-size: 22px; border-radius: 16px; box-shadow: 0 10px 30px rgba(59, 130, 246, .35); z-index: 6; }
.sgrp .pct, .chk-c .pct { transition: opacity .3s ease; }
.sgrp.pend .pct, .chk-c.pend .pct { opacity: 0; }
.chk-c.pend .ans-key, .chk-c.pend .why { visibility: hidden; }
.sf .blank, .sf .s-opt, .sf .pbtn { transition: background-color .2s, border-color .2s, color .2s, transform .12s; }
.s-opt.pressing, .pbtn.pressing { transform: translateY(3px); }
.tap-cup { position: absolute; left: 640px; top: 760px; width: 92px; z-index: 5; pointer-events: none; transition: left .55s cubic-bezier(.3, .7, .3, 1), top .55s cubic-bezier(.3, .7, .3, 1), transform .14s, opacity .3s; filter: drop-shadow(0 8px 12px rgba(29, 36, 71, .18)); }
.tap-cup.press { transform: scale(.86) translateY(8px); }
.tap-cup.gone { opacity: 0; }

/* ---------- 테스트본: 첫 화면 · 수정 강조 · 수업 진행 ---------- */
.top[hidden] { display: none; }
.home { padding: 36px 40px 64px; }
.home-in { max-width: 1240px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
.home h1 { font-size: 26px; }
.lcard { display: grid; grid-template-columns: minmax(260px, 1fr) minmax(0, 1.7fr); gap: 36px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 30px; }
.lc-info { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.lc-cls { font-size: 14px; font-weight: 700; color: var(--accent-d); }
.lc-info h2 { font-size: 26px; line-height: 1.35; }
.lc-btns { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; max-width: 320px; }
.btn.xl { height: 66px; font-size: 21px; border-radius: 14px; }
.btn.lg { height: 50px; font-size: 16px; }
.lc-pv { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.lc-pvh { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.lc-pvh b { font-size: 15px; }
.lc-nav { display: flex; align-items: center; gap: 6px; }
.arw { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 22px; line-height: 1; color: var(--ink-2); }
.arw:hover:not(:disabled) { background: var(--hover); }
.arw:disabled { opacity: .35; cursor: default; }
.lc-st { font-size: 14px; color: var(--ink-2); min-width: 150px; text-align: center; }
.pv-box.static { pointer-events: none; }
/* 수정 중인 부분 강조 */
.ff { padding: 8px 10px; margin: -8px -10px; border-radius: 10px; transition: background-color .15s; }
.ff:focus-within, .opt:focus-within, .slot-h:focus-within, .mini:focus-within { background: var(--edit-bg); box-shadow: inset 3px 0 0 var(--edit); }
.sf [data-ek] { transition: opacity .2s, box-shadow .2s, outline-color .2s; }
.sf .ek-on { outline: 5px solid var(--edit); outline-offset: 6px; border-radius: 14px; box-shadow: 0 0 0 14px color-mix(in srgb, var(--edit) 22%, transparent); position: relative; z-index: 2; }
.sf.ek-active [data-ek]:not(.ek-on) { opacity: .4; }
/* 대기실 */
.lobby-full { min-height: 100vh; display: grid; place-items: center; padding: 40px 24px; position: relative; }
.lobby-x { position: absolute; top: 18px; left: 18px; }
.lobby-card .lc-cls { font-size: 15px; }
/* 수업 진행: 위쪽 막대 없이 화면 + 오른쪽 조작 칸 */
.run { height: 100vh; display: grid; grid-template-columns: minmax(0, 1fr) 300px; background: var(--bg); }
.run-stage { position: relative; display: flex; align-items: center; justify-content: center; padding: 20px 24px 20px 88px; min-width: 0; }
.run-frame { position: relative; width: 100%; }
.run-prev { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface); font-size: 28px; line-height: 1; color: var(--muted); }
.run-prev:hover:not(:disabled) { color: var(--ink); background: var(--hover); }
.run-prev:disabled { opacity: .3; cursor: default; }
.rail { border-left: 1px solid var(--line); background: var(--surface); display: grid; grid-template-rows: 40px minmax(0, 1fr) 210px; gap: 16px; padding: 20px; min-height: 0; }
.rail-end { align-self: flex-end; }
.rail-info { display: flex; align-items: center; font-size: 14px; color: var(--ink-2); }
.rail-info b { font-size: 16px; font-variant-numeric: tabular-nums; }
.rail-info .ansn { align-self: flex-start; }
.run-next { align-self: center; min-height: 150px; border-radius: 24px; border: 0; background: var(--accent); color: var(--accent-ink); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 26px; font-weight: 700; box-shadow: 0 10px 30px rgba(59, 130, 246, .3); }
.run-next i { font-style: normal; font-size: 46px; line-height: .9; }
.run-next:hover { background: var(--accent-d); }
.run-next:active { transform: translateY(2px); }
.run-next.end { background: var(--ink); color: var(--surface); }
.peek { display: flex; flex-direction: column; gap: 6px; }

  .run-prev { display: none; }
}

/* PC: 편집기·수업 진행은 한 화면에 꼭 맞게 (페이지 스크롤 없이 오른쪽 칸만 스크롤) */
@media (min-width: 1101px) {
  .ed { height: calc(100vh - 60px); min-height: 0; }
  .ed-body { min-height: 0; overflow: hidden; }

  .side-panel { min-height: 0; overflow: hidden; }
  .sp-b { flex: 1; min-height: 0; }
}
.pv-box[data-fit] { margin-inline: auto; }
/* ---------- 좁은 화면 (PC 전제지만 깨지지 않게만) ---------- */

  .ed-body, .lv-body { grid-template-columns: minmax(0, 1fr); }
  .side-panel { border-left: 0; border-top: 1px solid var(--line); }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .side { border-right: 0; border-bottom: 1px solid var(--line); flex-direction: row; flex-wrap: wrap; padding: 10px 16px; }
  .side-h, .side-sep { display: none; }
  .main { padding: 24px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
  .tnav { display: none; }
  .me, .draft, .top-r .btn.text { display: none; }
  .top { gap: 12px; }
  .list .li, .lib .li { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .lib-h { display: none; }
  .li-a { justify-content: flex-start; }
  .res, .g3, .g2, .flow { grid-template-columns: minmax(0, 1fr); }
  .steps, .lv-steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .stage, .ed-bar, .lv-bar, .lv-body { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) { *:not(.tap-cup) { transition: none !important; animation: none !important; } }

/* ---------- 학생 화면 미리보기 전용 (학생 시안 스타일 그대로) ---------- */
.sf .tag { display: inline-flex; align-items: center; font-family: var(--disp); padding: 2px 12px; border-radius: 999px; white-space: nowrap; }
.sf .tag.sky { background: var(--sky); color: var(--sky-ink); }
.sf .tag.mint { background: var(--mint); color: var(--mint-ink); }

.sf, .sf * { --line: var(--line-2); }

/* ---------- 학생 화면 미리보기 (1180×820 원래 크기로 그리고 줄여서 보여 줌) ---------- */
.sf { width: 1180px; height: 820px; transform-origin: 0 0; position: absolute; left: 0; top: 0; background: var(--surface); border: 2px solid var(--line); border-bottom-width: 6px; border-radius: 32px; display: flex; flex-direction: column; overflow: hidden; pointer-events: auto; }

.sf-pl { font-family: var(--disp); font-size: 18px; color: var(--muted); font-variant-numeric: tabular-nums; }
.sf-body { flex: 1; display: grid; grid-template-columns: 40% 60%; min-height: 0; }

.sf-right { padding: 22px 44px 22px 14px; display: flex; flex-direction: column; justify-content: center; gap: 18px; min-width: 0; overflow: hidden; }
.sf-foot { display: flex; justify-content: space-between; padding: 14px 40px 22px; border-top: 2px solid var(--line); }

.sticker { position: absolute; top: -17px; left: 28px; background: var(--mark); color: var(--mark-ink); font-family: var(--disp); font-size: 18px; padding: 4px 16px; border-radius: 12px; transform: rotate(-3deg); }

.chk { display: flex; flex-direction: column; gap: 12px; }
.chk-c { border: 2px solid var(--line); border-bottom-width: 5px; border-radius: 22px; padding: 14px 20px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }

.pbtn { border: 2px solid var(--line); border-bottom-width: 5px; background: var(--surface); border-radius: 18px; padding: 4px 20px; font-size: 18px; min-height: 46px; font-family: var(--disp); }

      if (lv.step >= 3 && r.picks.some(function (v) { return v === null; })) r.picks = l.slots.map(function (sl) { var q = pickQ(), k = 0; sl.opts.forEach(function (o, oi) { if (o.q === q) k = oi; }); return k; });
      if (lv.step >= 5 && r.rp.some(function (v) { return !v; })) r.rp = l.cards.map(function (cd, ci) { var pr = cd.right === 'ok' ? .88 : ci === 1 ? .4 : .66; return Math.random() < pr ? cd.right : (cd.right === 'ok' ? 'sus' : 'ok'); });
      if (lv.step >= 6 && !r.ans && Math.random() < .85) r.ans = (/캐릭터|character/i.test(l.title || '') ? ANS : ANS2)[i % (/캐릭터|character/i.test(l.title || '') ? ANS : ANS2).length];
      if (JSON.stringify(r) !== before) { write(r); changed = true; }
    }
  }
  setInterval(function () {
    changed = false; tick();
    if (changed && location.hash.indexOf('#live-') === 0 && !UI.assign) render();
  }, 300);
})();

};
</script>
<script>
/* ---------- 복제본 추가: 입장 (학생 = 수업 코드 / 선생님 = 아이디·비밀번호) ----------
   서버가 없어서 “열린 수업”은 이 브라우저에 저장된 선생님 화면 기록으로 확인해요. */
(function () {
  var KEY = 'wia-teacher-draft-v4', TID = 'wia2026', TPW = '12345678';
  function creds() { try { var a = JSON.parse(WIA_STORE.getItem('wia-account') || 'null'); if (a && a.id && a.pw) return a; } catch (e) {} return { id: TID, pw: TPW }; }
  function byId(id) { return document.getElementById(id); }
  var it = byId('intro');
  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function show(id) {
    ['entry-choose', 'entry-stu', 'entry-tch'].forEach(function (x) { byId(x).hidden = x !== id; });
    it.classList.toggle('form-open', id !== 'entry-choose');
    var f = byId(id).querySelector('input'); if (f) f.focus();
    ['stu-err', 'tch-err'].forEach(function (x) { byId(x).hidden = true; });
  }
  function err(id, t) { var e = byId(id); e.textContent = t; e.hidden = false; }
  var lastErr = '';
  function findLive(code) {
    var r = window.WIA_SRV ? WIA_SRV.xhr('GET', '/api/live?code=' + encodeURIComponent(code)) : { status: 0, data: null };
    if (r.status === 0) { lastErr = '인터넷 연결을 확인해 주세요.'; return null; }
    if (r.status === 429) { lastErr = (r.data && r.data.error) || '잠시 뒤에 다시 해 주세요.'; return null; }
    var lv = null; try { lv = r.data && r.data.live ? JSON.parse(r.data.live) : null; } catch (e) {}
    return lv && lv.lesson ? lv : null;
  }
  function bootTeacher() {
    it.hidden = true;
    document.documentElement.style.overflow = '';
    document.body.classList.add('t-mode');
    var host = byId('t-host'); host.hidden = false;
    if (host.shadowRoot) return;
    var root = host.attachShadow({ mode: 'open' });
    root.appendChild(byId('t-tpl').content.cloneNode(true));
    /* 캐릭터·로고 그림은 학생 화면 스타일에서 그대로 가져옴 (파일에 한 번만 들어 있게) */
    var css = '.cup{display:block;max-width:100%}';
    Array.prototype.forEach.call(document.styleSheets, function (sh) {
      var rules; try { rules = sh.cssRules; } catch (e) { return; }
      Array.prototype.forEach.call(rules || [], function (r) {
        if (r.selectorText && /^(\.cup\.m-(basic|wink|action)|\.logo)$/.test(r.selectorText) && r.cssText.indexOf('data:image') > -1) css += r.cssText;
      });
    });
    var st = document.createElement('style'); st.textContent = css; root.appendChild(st);
    var sync = function () { var t = document.documentElement.getAttribute('data-theme'); if (t) host.setAttribute('data-theme', t); else host.removeAttribute('data-theme'); };
    sync(); new MutationObserver(sync).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    window.WIA_TEACHER_MAIN(root);
  }
  window.WIA_LOGOUT = function () { if (window.WIA_SRV) WIA_SRV.xhr('POST', '/api/logout', {}); ss('wia-auth', null); location.replace('/teacher'); };

  /* 학생 화면 위쪽: 들어온 수업 이름 + 나가기 */
  var stu = window.WIA_STUDENT;
  if (stu) byId('stu-cls').textContent = (stu.cls ? stu.cls + ' · ' : '') + stu.lesson.title;
  byId('wia-exit').addEventListener('click', function () { if (stu && stu.sid) { try { WIA_STORE.removeItem('wia-stu:' + stu.sid); } catch (e) {} } ss('wia-student', null); location.replace('/'); });

  var isT = /^\/teacher/.test(location.pathname), info = (window.WIA_SRV && WIA_SRV.info) || {};
  var qc = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '').slice(0, 6);
  Array.prototype.forEach.call(it.querySelectorAll('.entry-form [data-entry="back"]'), function (b) { b.hidden = true; });
  if (!isT && stu && qc && qc !== stu.code) { ss('wia-student', null); location.replace('/?code=' + qc); return; }
  if (isT && info.teacher) { ss('wia-auth', '1'); bootTeacher(); }
  else if (isT) { ss('wia-auth', null); document.documentElement.style.overflow = 'hidden'; show('entry-tch'); }
  else if (stu) it.hidden = true;
  else {
    document.documentElement.style.overflow = 'hidden'; show('entry-stu');
    if (qc.length === 6) setTimeout(function () { byId('stu-code').value = qc; var f = byId('entry-stu'); if (f.requestSubmit) f.requestSubmit(); else f.dispatchEvent(new Event('submit', { cancelable: true })); }, 0);
  }

  it.addEventListener('click', function (e) {
    var b = e.target.closest('[data-entry]'); if (!b) return;
    show(b.dataset.entry === 'stu' ? 'entry-stu' : b.dataset.entry === 'tch' ? 'entry-tch' : 'entry-choose');
  });
  byId('stu-code').addEventListener('input', function (e) { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); byId('stu-err').hidden = true; });
  byId('entry-stu').addEventListener('submit', function (e) {
    e.preventDefault();
    var code = byId('stu-code').value.trim();
    if (!/^\d{6}$/.test(code)) return err('stu-err', '수업 코드 6자리를 입력해 주세요.');
    var lv = findLive(code);
    if (!lv) { var em = lastErr || '수업을 찾지 못했어요. 코드를 다시 확인하거나, 선생님이 수업을 열었는지 확인해 주세요.'; lastErr = ''; return err('stu-err', em); }
    var sid = 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7), at = Date.now();
    try { WIA_STORE.setItem('wia-stu:' + sid, JSON.stringify({ sid: sid, code: code, epoch: lv.epoch, joinedAt: at, nick: '', picks: [null, null, null], rp: [null, null, null], ans: '', step: 0 })); } catch (e) {}
    ss('wia-auth', null);
    ss('wia-student', JSON.stringify({ code: code, epoch: lv.epoch, sid: sid, joinedAt: at, cls: lv.clsName, lesson: lv.lesson }));
    location.reload();
  });
  byId('entry-tch').addEventListener('submit', function (e) {
    e.preventDefault();
    var r = WIA_SRV.xhr('POST', '/api/login', { id: byId('tch-id').value.trim(), pw: byId('tch-pw').value });
    if (r.data && r.data.ok) { ss('wia-student', null); ss('wia-auth', '1'); location.replace('/teacher'); }
    else err('tch-err', (r.data && r.data.error) || '서버에 연결하지 못했어요. 인터넷 연결을 확인해 주세요.');
  });
})();
</script>
